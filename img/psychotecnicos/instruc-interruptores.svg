<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="560" height="260" fill="#f8f9fa" rx="10"/>
  <text x="280" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Tabla de interruptores</text>

  <!-- Table header row -->
  <rect x="20" y="32" width="120" height="28" fill="#4f46e5" rx="3"/>
