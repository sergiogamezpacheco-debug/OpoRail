<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>1. ¿Cuántas caras tiene un cubo?</text>
  <polygon points='260.0,130.0 360.0,180.0 260.0,230.0 160.0,180.0' fill='#d0d8e8' stroke='#334' stroke-width='2'/><polygon points='160.0,180.0 260.0,230.0 260.0,330.0 160.0,280.0' fill='#a8b8c8' stroke='#334' stroke-width='2'/><polygon points='360.0,180.0 260.0,230.0 260.0,330.0 360.0,280.0' fill='#bfcfdf' stroke='#334' stroke-width='2'/><text x='260' y='180' font-family='Arial' font-size='13' text-anchor='middle' fill='#334' font-weight='normal'>T</text><text x='210' y='255' font-family='Arial' font-size='13' text-anchor='middle' fill='#334' font-weight='normal'>I</text><text x='310' y='255' font-family='Arial' font-size='13' text-anchor='middle' fill='#334' font-weight='normal'>D</text><circle cx='260' cy='145' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='260' y='150' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>1</text><circle cx='150' cy='250' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='150' y='255' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>2</text><circle cx='370' cy='250' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='370' y='255' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>3</text><circle cx='260' cy='340' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='260' y='345' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>4</text><circle cx='190' cy='200' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='190' y='205' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>5</text><circle cx='330' cy='200' r='18' fill='#e0e8f8' stroke='#3a5a8c' stroke-width='2'/><text x='330' y='205' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>6</text><text x='500' y='200' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>Un cubo tiene</text><text x='500' y='230' font-family='Arial' font-size='24' text-anchor='middle' fill='#c00' font-weight='bold'>6 caras</text><text x='500' y='260' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>(Superior, Inferior,</text><text x='500' y='280' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Frontal, Trasera,</text><text x='500' y='300' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Izquierda, Derecha)</text>
