<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Fichas de dominó — ¿Cuál completa el par?</text>
  <!-- Reference domino [3|5] vertical -->
  <rect x="55" y="30" width="50" height="110" fill="white" stroke="#374151" stroke-width="2.5" rx="5"/>
  <line x1="55" y1="85" x2="105" y2="85" stroke="#374151" stroke-width="2"/>
  <!-- 3 dots top -->
  <circle cx="72" cy="48" r="5" fill="#374151"/>
  <circle cx="88" cy="65" r="5" fill="#374151"/>
  <circle cx="72" cy="80" r="5" fill="#374151"/>
  <!-- 5 dots bottom -->
  <circle cx="72" cy="97" r="5" fill="#374151"/>
  <circle cx="88" cy="97" r="5" fill="#374151"/>
  <circle cx="80" cy="112" r="5" fill="#374151"/>
  <circle cx="72" cy="127" r="5" fill="#374151"/>
  <circle cx="88" cy="127" r="5" fill="#374151"/>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#6b7280" font-family="Arial">Referencia</text>

  <!-- Options A [5|3] -->
  <rect x="135" y="30" width="50" height="110" fill="white" stroke="#374151" stroke-width="2" rx="5"/>
  <line x1="135" y1="85" x2="185" y2="85" stroke="#374151" stroke-width="1.5"/>
  <!-- 5 top -->
  <circle cx="152" cy="43" r="4.5" fill="#374151"/><circle cx="168" cy="43" r="4.5" fill="#374151"/>
  <circle cx="160" cy="58" r="4.5" fill="#374151"/>
  <circle cx="152" cy="73" r="4.5" fill="#374151"/><circle cx="168" cy="73" r="4.5" fill="#374151"/>
  <!-- 3 bottom -->
  <circle cx="148" cy="97" r="4.5" fill="#374151"/>
  <circle cx="160" cy="112" r="4.5" fill="#374151"/>
  <circle cx="172" cy="127" r="4.5" fill="#374151"/>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">A</text>

  <!-- Options B [3|5] but horizontal -->
  <rect x="205" y="50" width="80" height="50" fill="white" stroke="#374151" stroke-width="2" rx="5"/>
  <line x1="245" y1="50" x2="245" y2="100" stroke="#374151" stroke-width="1.5"/>
  <!-- 3 left -->
  <circle cx="225" cy="60" r="4" fill="#374151"/>
  <circle cx="232" cy="75" r="4" fill="#374151"/>
  <circle cx="225" cy="90" r="4" fill="#374151"/>
  <!-- 5 right -->
  <circle cx="255" cy="57" r="4" fill="#374151"/><circle cx="270" cy="57" r="4" fill="#374151"/>
  <circle cx="262" cy="75" r="4" fill="#374151"/>
  <circle cx="255" cy="93" r="4" fill="#374151"/><circle cx="270" cy="93" r="4" fill="#374151"/>
  <text x="245" y="120" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">B (girada 90°)</text>
  <text x="150" y="168" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Ficha girada 90° en sentido horario</text>
</svg>