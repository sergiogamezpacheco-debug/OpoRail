<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>2. Si despliegas un cubo, ¿cuántos cuadrados obtienes?</text>
  <rect x='190' y='80' width='70' height='70' fill='#d0d8f0' stroke='#445' stroke-width='2'/><text x='225' y='121' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>1</text><rect x='120' y='150' width='70' height='70' fill='#c8d8e8' stroke='#445' stroke-width='2'/><text x='155' y='191' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>2</text><rect x='190' y='150' width='70' height='70' fill='#d8e0d0' stroke='#445' stroke-width='2'/><text x='225' y='191' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>3</text><rect x='260' y='150' width='70' height='70' fill='#e8d8d0' stroke='#445' stroke-width='2'/><text x='295' y='191' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>4</text><rect x='330' y='150' width='70' height='70' fill='#d8d0e8' stroke='#445' stroke-width='2'/><text x='365' y='191' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>5</text><rect x='190' y='220' width='70' height='70' fill='#e0e8d0' stroke='#445' stroke-width='2'/><text x='225' y='261' font-family='Arial' font-size='16' text-anchor='middle' fill='#334' font-weight='bold'>6</text><text x='360' y='320' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>Plantilla (desarrollo plano) del cubo: 6 cuadrados</text><text x='500' y='160' font-family='Arial' font-size='18' text-anchor='middle' fill='#c00' font-weight='bold'>= 6 cuadrados</text><line x1='440' y1='155' x2='395' y2='145' stroke='#c00' stroke-width='2'/><polygon points='395.0,145.0 405.8,142.3 403.7,152.1' fill='#c00'/>
</svg>