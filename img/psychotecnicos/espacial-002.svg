<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Vista del cubo — Identifica la vista frontal</text>
  <!-- 3D cube in isometric -->
  <g transform="translate(50,30)">
    <!-- Front face -->
    <polygon points="0,60 60,60 60,120 0,120" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <!-- Top face -->
    <polygon points="0,60 30,30 90,30 60,60" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- Right face -->
    <polygon points="60,60 90,30 90,90 60,120" fill="#bfdbfe" stroke="#374151" stroke-width="2"/>
    <!-- Dot pattern on front face: star shape -->
    <circle cx="30" cy="90" r="6" fill="#374151"/>
    <circle cx="30" cy="75" r="4" fill="#374151"/>
    <circle cx="30" cy="105" r="4" fill="#374151"/>
    <circle cx="15" cy="90" r="4" fill="#374151"/>
    <circle cx="45" cy="90" r="4" fill="#374151"/>
    <text x="30" y="142" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Cubo 3D</text>
  </g>
  <!-- Arrow -->
  <text x="160" y="105" text-anchor="middle" font-size="20" fill="#374151">→</text>
  <!-- Four view options -->
  <!-- View A (correct: 5 dots cross) -->
  <rect x="175" y="40" width="48" height="48" fill="white" stroke="#374151" stroke-width="1.5" rx="2"/>
  <circle cx="199" cy="64" r="5" fill="#374151"/>
  <circle cx="199" cy="51" r="3.5" fill="#374151"/>
  <circle cx="199" cy="77" r="3.5" fill="#374151"/>
  <circle cx="186" cy="64" r="3.5" fill="#374151"/>
  <circle cx="212" cy="64" r="3.5" fill="#374151"/>
  <text x="199" y="100" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">A</text>
  <!-- View B (wrong: 3 dots row) -->
  <rect x="235" y="40" width="48" height="48" fill="white" stroke="#374151" stroke-width="1.5" rx="2"/>
  <circle cx="249" cy="64" r="4" fill="#374151"/>
  <circle cx="259" cy="64" r="4" fill="#374151"/>
  <circle cx="269" cy="64" r="4" fill="#374151"/>
  <text x="259" y="100" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">B</text>
  <!-- View C (wrong: diagonal) -->
  <rect x="175" y="115" width="48" height="48" fill="white" stroke="#374151" stroke-width="1.5" rx="2"/>
  <circle cx="185" cy="125" r="4" fill="#374151"/>
  <circle cx="199" cy="139" r="4" fill="#374151"/>
  <circle cx="213" cy="153" r="4" fill="#374151"/>
  <text x="199" y="175" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">C</text>
  <!-- View D (wrong: 2 dots) -->
  <rect x="235" y="115" width="48" height="48" fill="white" stroke="#374151" stroke-width="1.5" rx="2"/>
  <circle cx="249" cy="131" r="5" fill="#374151"/>
  <circle cx="269" cy="151" r="5" fill="#374151"/>
  <text x="259" y="175" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">D</text>
  <text x="150" y="192" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">¿Cuál es la vista frontal del cubo?</text>
</svg>