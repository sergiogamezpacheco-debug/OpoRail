<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>6. Cuadrado girado 90° × 4 veces — ¿cuántas vueltas completas?</text>
  <polygon points='106.8,231.8 43.2,231.8 43.2,168.2 106.8,168.2' fill='#d0d8e8' stroke='#3a5a8c' stroke-width='3'/><text x='75' y='265' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>0°</text><text x='130' y='205' font-family='Arial' font-size='20' fill='#555'>→</text><polygon points='171.2,231.8 171.2,168.2 234.8,168.2 234.8,231.8' fill='#d0d8e8' stroke='#3a5a8c' stroke-width='3'/><text x='203' y='265' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>90°</text><text x='258' y='205' font-family='Arial' font-size='20' fill='#555'>→</text><polygon points='299.2,168.2 362.8,168.2 362.8,231.8 299.2,231.8' fill='#d0d8e8' stroke='#3a5a8c' stroke-width='3'/><text x='331' y='265' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>180°</text><text x='386' y='205' font-family='Arial' font-size='20' fill='#555'>→</text><polygon points='490.8,168.2 490.8,231.8 427.2,231.8 427.2,168.2' fill='#d0d8e8' stroke='#3a5a8c' stroke-width='3'/><text x='459' y='265' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>270°</text><text x='514' y='205' font-family='Arial' font-size='20' fill='#555'>→</text><polygon points='618.8,231.8 555.2,231.8 555.2,168.2 618.8,168.2' fill='#ffaaaa' stroke='#3a5a8c' stroke-width='3'/><text x='587' y='265' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>360°</text><text x='360' y='350' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>4 giros de 90° = 1 vuelta completa (360°)</text>
</svg>