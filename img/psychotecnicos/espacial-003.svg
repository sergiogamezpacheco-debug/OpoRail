<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="#f9fafb"/>
  <text x="160" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Rotación de figura — ¿Cuál es la figura girada 90°?</text>
  <!-- Original shape: L-shape -->
  <g transform="translate(30,40)">
    <polygon points="0,0 30,0 30,20 10,20 10,60 0,60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="15" y="78" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Original</text>
  </g>
  <text x="80" y="85" font-size="18" fill="#374151">→</text>
  <!-- Option A: L rotated 90° CW (correct) -->
  <g transform="translate(100,40)">
    <polygon points="0,30 60,30 60,60 20,60 20,40 0,40" fill="#d1fae5" stroke="#16a34a" stroke-width="2"/>
    <text x="30" y="78" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">A</text>
  </g>
  <!-- Option B: L flipped (wrong) -->
  <g transform="translate(180,40)">
    <polygon points="30,0 60,0 60,60 50,60 50,20 30,20" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="30" y="78" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">B</text>
  </g>
  <!-- Option C: L rotated 180° (wrong) -->
  <g transform="translate(260,40)">
    <polygon points="0,0 10,0 10,40 30,40 30,60 0,60" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="15" y="78" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">C</text>
  </g>
  <text x="160" y="115" text-anchor="middle" font-size="10" fill="#6b7280" font-family="Arial">Giro de 90° en sentido horario</text>
  <text x="160" y="132" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">La figura original es una L. Rotada 90° CW se convierte en</text>
  <text x="160" y="148" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">una forma horizontal con el palo hacia arriba a la izquierda.</text>
</svg>