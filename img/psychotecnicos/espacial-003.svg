<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>3. Cubo 3×3×3 pintado arriba+abajo: ¿cuántos cubitos sin pintar?</text>
  <polygon points='120.0,145.0 175.0,173.0 120.0,200.0 65.0,173.0' fill='#ffaaaa' stroke='#334' stroke-width='2'/><polygon points='65.0,173.0 120.0,200.0 120.0,255.0 65.0,227.0' fill='#dd7777' stroke='#334' stroke-width='2'/><polygon points='175.0,173.0 120.0,200.0 120.0,255.0 175.0,227.0' fill='#ee8888' stroke='#334' stroke-width='2'/><text x='120' y='280' font-family='Arial' font-size='12' text-anchor='middle' fill='#333' font-weight='normal'>Superior (ROJO)</text><polygon points='280.0,145.0 335.0,173.0 280.0,200.0 225.0,173.0' fill='#d0d8e8' stroke='#334' stroke-width='2'/><polygon points='225.0,173.0 280.0,200.0 280.0,255.0 225.0,227.0' fill='#a8b8c8' stroke='#334' stroke-width='2'/><polygon points='335.0,173.0 280.0,200.0 280.0,255.0 335.0,227.0' fill='#bfcfdf' stroke='#334' stroke-width='2'/><text x='280' y='280' font-family='Arial' font-size='12' text-anchor='middle' fill='#333' font-weight='normal'>Medio (sin pintar)</text><polygon points='440.0,145.0 495.0,173.0 440.0,200.0 385.0,173.0' fill='#ffaaaa' stroke='#334' stroke-width='2'/><polygon points='385.0,173.0 440.0,200.0 440.0,255.0 385.0,227.0' fill='#dd7777' stroke='#334' stroke-width='2'/><polygon points='495.0,173.0 440.0,200.0 440.0,255.0 495.0,227.0' fill='#ee8888' stroke='#334' stroke-width='2'/><text x='440' y='280' font-family='Arial' font-size='12' text-anchor='middle' fill='#333' font-weight='normal'>Inferior (ROJO)</text><text x='360' y='340' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>3×3×3 = 27 cubitos totales</text><text x='360' y='365' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>Capa top: 9 pintados | Capa bottom: 9 pintados</text><text x='360' y='388' font-family='Arial' font-size='14' text-anchor='middle' fill='#1a5c2a' font-weight='bold'>Capa MEDIA (9 cubitos): sin pintar = 9</text>
</svg>