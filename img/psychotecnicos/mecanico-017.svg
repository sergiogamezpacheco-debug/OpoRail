  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>17. Pistón Ø5cm (r=25mm), carrera 20mm → volumen desplazado</text>
  <rect x='220' y='80' width='120' height='220' rx='5' fill='none' stroke='#555' stroke-width='3'/><rect x='225' y='120' width='110' height='22' fill='#9090b0' stroke='#446' stroke-width='2'/><line x1='175' y1='120' x2='175' y2='280' stroke='#c00' stroke-width='2.5'/><polygon points='175.0,280.0 169.0,268.0 181.0,268.0' fill='#c00'/><line x1='165' y1='120' x2='185' y2='120' stroke='#c00' stroke-width='2'/><line x1='165' y1='280' x2='185' y2='280' stroke='#c00' stroke-width='2'/><text x='155' y='205' font-family='Arial' font-size='13' text-anchor='end' fill='#c00' font-weight='normal'>20 mm</text><line x1='222' y1='310' x2='338' y2='310' stroke='#2a5a2a' stroke-width='2'/><text x='280' y='328' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>Ø 50 mm</text><rect x='80' y='355' width='560' height='50' rx='6' fill='#fffbe6' stroke='#c8a000' stroke-width='1.5'/><text x='360' y='378' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>V = π × r² × L = π × 25² × 20 = π × 625 × 20</text><text x='360' y='398' font-family='Arial' font-size='14' text-anchor='middle' fill='#c00' font-weight='bold'>V ≈ 39 270 mm³ ≈ 39,3 cm³</text>
