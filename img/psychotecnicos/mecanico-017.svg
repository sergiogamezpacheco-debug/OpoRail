<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Palanca de 2º grado — Carga entre fulcro y fuerza</text>
  <!-- Beam -->
  <rect x="50" y="88" width="210" height="8" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <!-- Fulcrum at left end -->
  <polygon points="50,96 35,125 65,125" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <line x1="20" y1="125" x2="80" y2="125" stroke="#374151" stroke-width="2"/>
  <!-- Carga en el centro -->
  <line x1="165" y1="50" x2="165" y2="86" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="165,88 159,72 171,72" fill="#2563eb"/>
  <text x="165" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb" font-family="Arial">P</text>
  <!-- Force at right end -->
  <line x1="255" y1="50" x2="255" y2="86" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="255,88 249,72 261,72" fill="#ef4444"/>
  <text x="255" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444" font-family="Arial">F</text>
  <!-- Distances -->
  <line x1="50" y1="140" x2="165" y2="140" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="107" y="153" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">d₁ (brazo P)</text>
  <line x1="50" y1="150" x2="255" y2="150" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="152" y="164" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial">d₂ (brazo F)</text>
  <text x="150" y="175" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">F × d₂ = P × d₁ → F &lt; P (ventaja)</text>
</svg>