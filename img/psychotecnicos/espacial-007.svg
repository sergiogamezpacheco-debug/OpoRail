  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>7. ¿Cuántos triángulos equiláteros forman un octaedro regular?</text>
  <polygon points='260,80 150,220 370,220' fill='#d0d8f0' stroke='#334' stroke-width='2'/><polygon points='260,80 260,360 370,220' fill='#bfcfdf' stroke='#334' stroke-width='2'/><polygon points='260,80 260,360 150,220' fill='#a8b8c8' stroke='#334' stroke-width='2' opacity='0.6'/><polygon points='260,360 150,220 370,220' fill='#c8d0e0' stroke='#334' stroke-width='2'/><line x1='260' y1='80' x2='260' y2='360' stroke='#aaa' stroke-width='1.5' stroke-dasharray='4 3'/><text x='390' y='180' font-family='Arial' font-size='16' text-anchor='middle' fill='#c00' font-weight='bold'>8 triángulos</text><text x='390' y='205' font-family='Arial' font-size='16' text-anchor='middle' fill='#c00' font-weight='bold'>equiláteros</text><text x='390' y='235' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>= octaedro regular</text><text x='260' y='380' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Octaedro: 8 caras triangulares, 6 vértices, 12 aristas</text>
