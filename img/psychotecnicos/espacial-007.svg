<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Piezas encajadas — ¿Qué pieza completa la figura?</text>
  <!-- Main shape with hole -->
  <g transform="translate(20,30)">
    <rect x="0" y="0" width="80" height="80" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <!-- Hole (L shape cut out) -->
    <rect x="40" y="0" width="40" height="40" fill="#f9fafb"/>
    <text x="60" y="22" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="Arial">hueco</text>
    <text x="40" y="98" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Figura base</text>
  </g>
  <!-- Question mark in hole -->
  <text x="80" y="65" text-anchor="middle" font-size="24" fill="#d1d5db">?</text>
  <!-- Arrow -->
  <text x="120" y="70" text-anchor="middle" font-size="18" fill="#374151">→</text>
  <!-- Option A (correct L-shape) -->
  <g transform="translate(140,30)">
    <rect x="0" y="0" width="40" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="55" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">A ✓</text>
  </g>
  <!-- Option B (wrong size) -->
  <g transform="translate(200,30)">
    <rect x="0" y="0" width="40" height="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="55" text-anchor="middle" font-size="10" fill="#6b7280" font-family="Arial">B</text>
  </g>
  <!-- Option C (wrong shape) -->
  <g transform="translate(140,100)">
    <polygon points="0,0 40,0 40,40 20,40" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="55" text-anchor="middle" font-size="10" fill="#6b7280" font-family="Arial">C</text>
  </g>
  <!-- Option D (correct size wrong orientation) -->
  <g transform="translate(200,100)">
    <rect x="0" y="0" width="20" height="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="55" text-anchor="middle" font-size="10" fill="#6b7280" font-family="Arial">D</text>
  </g>
</svg>