<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Plano inclinado — Ventaja mecánica</text>
  <!-- Inclined plane -->
  <polygon points="40,150 260,150 260,60" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <!-- Ground -->
  <line x1="20" y1="150" x2="280" y2="150" stroke="#374151" stroke-width="2"/>
  <!-- Object on plane -->
  <rect x="175" y="92" width="30" height="20" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" rx="2" transform="rotate(-20,190,100)"/>
  <text x="190" y="102" text-anchor="middle" font-size="10" fill="#78350f" font-family="Arial">P</text>
  <!-- Force arrow along slope -->
  <line x1="160" y1="112" x2="130" y2="128" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="128,130 138,115 120,120" fill="#ef4444"/>
  <text x="118" y="140" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">F</text>
  <!-- Height label -->
  <line x1="265" y1="60" x2="265" y2="150" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="278" y="108" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">h</text>
  <!-- Length label -->
  <line x1="40" y1="155" x2="260" y2="155" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="150" y="168" text-anchor="middle" font-size="9" fill="#16a34a" font-family="Arial">L (longitud)</text>
  <text x="80" y="90" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">VM = L/h</text>
</svg>