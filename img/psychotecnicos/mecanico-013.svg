<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>13. Motor 10 kW a 1000 rpm — ¿cuál es el par motor?</text>
  <rect x='180' y='140' width='220' height='130' rx='12' fill='#d0d8e0' stroke='#445566' stroke-width='4'/><text x='290' y='185' font-family='Arial' font-size='18' text-anchor='middle' fill='#333' font-weight='bold'>⚡ Motor</text><text x='290' y='210' font-family='Arial' font-size='14' text-anchor='middle' fill='#1a3a6c' font-weight='normal'>P = 10 kW</text><text x='290' y='232' font-family='Arial' font-size='14' text-anchor='middle' fill='#1a3a6c' font-weight='normal'>n = 1000 rpm</text><rect x='400' y='195' width='120' height='20' fill='#888' stroke='#555' stroke-width='2'/><text x='480' y='185' font-family='Arial' font-size='24' fill='#2a5a2a'>↻</text><text x='450' y='240' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>1000 rpm</text><rect x='80' y='320' width='560' height='55' rx='8' fill='#fffbe6' stroke='#c8a000' stroke-width='2'/><text x='360' y='345' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>T = P × 60 / (2π × n) = 10000 × 60 / (2π × 1000)</text><text x='360' y='368' font-family='Arial' font-size='15' text-anchor='middle' fill='#c00' font-weight='bold'>T ≈ 95,5 N·m</text>
</svg>