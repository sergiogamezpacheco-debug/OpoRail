<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Manivela — Movimiento circular → lineal</text>
  <!-- Central axle -->
  <circle cx="150" cy="95" r="10" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Crank arm -->
  <rect x="150" y="85" width="60" height="10" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5" rx="3"/>
  <!-- Pin at end of crank -->
  <circle cx="210" cy="90" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Connecting rod -->
  <line x1="210" y1="90" x2="270" y2="95" stroke="#374151" stroke-width="3"/>
  <!-- Slider (piston) -->
  <rect x="270" y="80" width="22" height="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="3"/>
  <!-- Cylinder guide -->
  <line x1="270" y1="78" x2="295" y2="78" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="270" y1="112" x2="295" y2="112" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Rotation arrow -->
  <path d="M 155,72 A 25,25 0 0,1 175,80" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a13)"/>
  <!-- Linear arrow -->
  <line x1="250" y1="108" x2="235" y2="108" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="230" y="120" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">↔ mov. lineal</text>
  <defs><marker id="a13" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/></marker></defs>
  <text x="100" y="155" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Radio manivela = 60mm → carrera = 120mm</text>
</svg>