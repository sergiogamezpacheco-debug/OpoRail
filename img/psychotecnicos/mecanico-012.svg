<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Cuña — Transforma fuerza lineal en lateral</text>
  <!-- Wedge -->
  <polygon points="80,140 220,140 150,60" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <!-- Force arrow downward at apex -->
  <line x1="150" y1="30" x2="150" y2="58" stroke="#ef4444" stroke-width="3"/>
  <polygon points="150,60 143,44 157,44" fill="#ef4444"/>
  <text x="150" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444" font-family="Arial">F</text>
  <!-- Lateral forces -->
  <line x1="78" y1="100" x2="50" y2="100" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="48,100 62,94 62,106" fill="#2563eb"/>
  <text x="38" y="100" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">←R</text>
  <line x1="222" y1="100" x2="250" y2="100" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="252,100 238,94 238,106" fill="#2563eb"/>
  <text x="262" y="100" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">R→</text>
  <!-- Angle label -->
  <path d="M 150,100 L 170,85 A 25,25 0 0,0 150,100" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="175" y="110" text-anchor="middle" font-size="10" fill="#16a34a" font-family="Arial">α</text>
  <text x="150" y="165" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Cuanto menor es α, mayor ventaja mecánica</text>
</svg>