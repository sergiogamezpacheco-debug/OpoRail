  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>14. Correa dentada: poleas 100mm y 200mm, A=600rpm → B=?</text>
  <circle cx='180' cy='210' r='50' fill='#d0d8e8' stroke='#3a5a8c' stroke-width='4'/><circle cx='180' cy='210' r='12' fill='#3a5a8c'/><text x='180' y='275' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>A  Ø100 mm</text><text x='180' y='293' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>600 rpm</text><circle cx='480' cy='210' r='100' fill='#d8e8d0' stroke='#2a5a3c' stroke-width='4'/><circle cx='480' cy='210' r='20' fill='#2a5a3c'/><text x='480' y='325' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>B  Ø200 mm</text><text x='480' y='343' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>? rpm</text><line x1='180' y1='160' x2='480' y2='110' stroke='#555' stroke-width='5'/><line x1='180' y1='260' x2='480' y2='310' stroke='#555' stroke-width='5'/><rect x='80' y='370' width='560' height='30' rx='6' fill='#fffbe6' stroke='#c8a000' stroke-width='1.5'/><text x='360' y='390' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>nB = nA × dA/dB = 600 × 100/200 = 300 rpm</text>
