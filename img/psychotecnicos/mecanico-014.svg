<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f0f9ff"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Presión del viento sobre una superficie</text>
  <!-- Wind arrows left to right -->
  <line x1="20" y1="70" x2="80" y2="70" stroke="#60a5fa" stroke-width="2.5"/>
  <polygon points="82,70 70,64 70,76" fill="#60a5fa"/>
  <line x1="20" y1="90" x2="80" y2="90" stroke="#60a5fa" stroke-width="2.5"/>
  <polygon points="82,90 70,84 70,96" fill="#60a5fa"/>
  <line x1="20" y1="110" x2="80" y2="110" stroke="#60a5fa" stroke-width="2.5"/>
  <polygon points="82,110 70,104 70,116" fill="#60a5fa"/>
  <text x="40" y="55" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">viento →</text>
  <!-- Vertical sail -->
  <rect x="110" y="40" width="20" height="110" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <!-- Resulting force arrow (perpendicular to sail = horizontal) -->
  <line x1="130" y1="95" x2="200" y2="95" stroke="#ef4444" stroke-width="3"/>
  <polygon points="202,95 188,89 188,101" fill="#ef4444"/>
  <text x="220" y="99" text-anchor="start" font-size="10" fill="#ef4444" font-family="Arial">F resultante</text>
  <!-- Pressure formula -->
  <text x="150" y="165" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">F = P_din × A (P_din = ½ρv²)</text>
  <!-- Inclined sail reference -->
  <text x="60" y="165" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">↓ viento</text>
</svg>