<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f0f9ff"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Sifón — Transferencia de líquido</text>
  <!-- Left container (full) -->
  <rect x="30" y="50" width="70" height="110" fill="none" stroke="#6b7280" stroke-width="2"/>
  <rect x="31" y="80" width="68" height="79" fill="#93c5fd" opacity="0.7"/>
  <text x="65" y="70" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Dep. A (alto)</text>
  <!-- Right container (low) -->
  <rect x="200" y="90" width="70" height="70" fill="none" stroke="#6b7280" stroke-width="2"/>
  <rect x="201" y="140" width="68" height="19" fill="#93c5fd" opacity="0.7"/>
  <text x="235" y="82" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Dep. B (bajo)</text>
  <!-- Siphon tube -->
  <path d="M 80,85 L 80,30 L 220,30 L 220,140" fill="none" stroke="#374151" stroke-width="4"/>
  <!-- Flow arrows along siphon -->
  <polygon points="130,30 120,24 120,36" fill="#ef4444"/>
  <polygon points="220,100 214,86 226,86" fill="#ef4444"/>
  <text x="150" y="22" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">→ flujo</text>
  <!-- Height labels -->
  <line x1="22" y1="80" x2="22" y2="160" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="10" y="120" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial" transform="rotate(-90,10,120)">h₁</text>
  <line x1="280" y1="140" x2="280" y2="160" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="290" y="152" text-anchor="start" font-size="9" fill="#16a34a" font-family="Arial">h₂</text>
  <text x="150" y="180" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Fluye mientras h₁ &gt; h₂ y el tubo esté lleno</text>
</svg>