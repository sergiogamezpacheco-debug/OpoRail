  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>19. ¿Qué acoplamiento absorbe desalineaciones de ejes?</text>
  <rect x='80' y='195' width='180' height='30' fill='#9090a0' stroke='#555' stroke-width='2'/><rect x='460' y='195' width='180' height='30' fill='#9090a0' stroke='#555' stroke-width='2'/><rect x='255' y='180' width='60' height='60' rx='6' fill='#e0c080' stroke='#a07020' stroke-width='3'/><rect x='275' y='180' width='20' height='60' rx='3' fill='#c0a060' stroke='none'/><line x1='315' y1='210' x2='460' y2='215' stroke='#9090a0' stroke-width='4' stroke-dasharray='6 4'/><line x1='460' y1='195' x2='460' y2='205' stroke='#c00' stroke-width='2.5'/><polygon points='460.0,205.0 454.0,193.0 466.0,193.0' fill='#c00'/><text x='470' y='195' font-family='Arial' font-size='13' fill='#c00'>Desalineación</text><text x='470' y='205' font-family='Arial' font-size='12' text-anchor='start' fill='#c00' font-weight='normal'>← desviación</text><text x='360' y='280' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='bold'>Acoplamiento flexible / elástico</text><text x='360' y='305' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Absorbe desalineaciones angulares y paralelas</text><text x='360' y='330' font-family='Arial' font-size='12' text-anchor='middle' fill='#777' font-weight='normal'>e.g. acoplamiento de araña, cardan, oldham</text>
