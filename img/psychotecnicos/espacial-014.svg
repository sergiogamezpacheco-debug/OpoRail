<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190">
  <rect width="300" height="190" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Rotación mental 3D — ¿Cuál es la misma figura girada?</text>
  <!-- Object: L-shaped 3D block -->
  <g transform="translate(20,30)">
    <!-- Big block bottom -->
    <polygon points="0,40 30,20 60,40 60,80 30,100 0,80" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <!-- Small block on top-left -->
    <polygon points="0,40 15,30 30,40 15,50" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="0,40 0,60 15,70 15,50" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <text x="30" y="118" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Original</text>
  </g>
  <text x="100" y="82" font-size="18" fill="#374151">→</text>
  <!-- Option A: rotated 90° around Y (correct) -->
  <g transform="translate(115,30)">
    <polygon points="0,40 30,20 60,40 60,80 30,100 0,80" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
    <polygon points="30,20 45,10 60,20 45,30" fill="#a7f3d0" stroke="#16a34a" stroke-width="1.5"/>
    <polygon points="60,40 60,60 45,70 45,50" fill="#6ee7b7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="30" y="118" text-anchor="middle" font-size="9" fill="#16a34a" font-family="Arial">A</text>
  </g>
  <!-- Option B: wrong (flipped) -->
  <g transform="translate(205,30)">
    <polygon points="0,40 30,20 60,40 60,80 30,100 0,80" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
    <polygon points="30,20 45,30 30,40 15,30" fill="#fecaca" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
    <polygon points="0,40 0,60 15,70 15,50" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="30" y="118" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial">B (¿?)</text>
  </g>
  <text x="150" y="148" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">La muesca sobresale en distinto lado en cada opción.</text>
  <text x="150" y="165" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">¿Cuál puede ser el mismo objeto girado?</text>
</svg>