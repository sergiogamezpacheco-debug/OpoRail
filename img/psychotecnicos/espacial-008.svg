<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">¿Es el mismo sólido? — Identifica la vista equivalente</text>
  <!-- Solid 1 isometric: cube with notch top-left -->
  <g transform="translate(20,30)">
    <polygon points="10,30 50,10 90,30 50,50" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <polygon points="10,30 10,70 50,90 50,50" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <polygon points="90,30 90,70 50,90 50,50" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <!-- Notch -->
    <polygon points="10,30 30,20 50,30 30,40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="108" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Sólido A</text>
  </g>
  <!-- Arrow -->
  <text x="130" y="75" text-anchor="middle" font-size="18" fill="#374151">=?</text>
  <!-- Solid 2 (same but rotated 120°) -->
  <g transform="translate(160,30)">
    <polygon points="10,30 50,10 90,30 50,50" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <polygon points="10,30 10,70 50,90 50,50" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <polygon points="90,30 90,70 50,90 50,50" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <!-- Notch now on top-right -->
    <polygon points="50,30 70,20 90,30 70,40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="108" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Sólido B</text>
  </g>
  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">¿Son el mismo sólido en distinta posición?</text>
  <text x="150" y="155" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Fíjate en la posición de la muesca azul</text>
</svg>