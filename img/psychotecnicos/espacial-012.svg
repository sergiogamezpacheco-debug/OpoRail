<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>12. ¿Cuántas aristas tiene una pirámide de base cuadrada?</text>
  <polygon points='150,250 260,195 370,250 260,305' fill='#c8d4e0' stroke='#334' stroke-width='2'/><polygon points='260,90 150,250 260,305' fill='#b8c8d8' stroke='#334' stroke-width='2'/><polygon points='260,90 370,250 260,305' fill='#d0dce8' stroke='#334' stroke-width='2'/><polygon points='260,90 150,250 260,195' fill='#c0ccdc' stroke='#334' stroke-width='2' opacity='0.7'/><polygon points='260,90 370,250 260,195' fill='#d8e4f0' stroke='#334' stroke-width='2' opacity='0.7'/><text x='490' y='170' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='bold'>Aristas:</text><text x='490' y='200' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>4 base</text><text x='490' y='225' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>+ 4 laterales</text><text x='490' y='255' font-family='Arial' font-size='20' text-anchor='middle' fill='#c00' font-weight='bold'>= 8 aristas</text><text x='360' y='390' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Pirámide cuadrangular: 5 vértices, 8 aristas, 5 caras</text>
</svg>