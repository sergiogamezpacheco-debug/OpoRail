  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>10. ¿Cuántos ejes de simetría tiene un cuadrado?</text>
  <rect x='150' y='100' width='220' height='220' fill='#d0d8e8' stroke='#334' stroke-width='3'/><line x1='260' y1='80' x2='260' y2='340' stroke='#c00' stroke-width='2' stroke-dasharray='8 4'/><line x1='130' y1='210' x2='390' y2='210' stroke='#2a5a2a' stroke-width='2' stroke-dasharray='8 4'/><line x1='136' y1='86' x2='384' y2='334' stroke='#7a2a9c' stroke-width='2' stroke-dasharray='8 4'/><line x1='384' y1='86' x2='136' y2='334' stroke='#c07010' stroke-width='2' stroke-dasharray='8 4'/><text x='460' y='150' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>4 ejes de</text><text x='460' y='178' font-family='Arial' font-size='18' text-anchor='middle' fill='#c00' font-weight='bold'>simetría</text><text x='460' y='210' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>• 2 medianas</text><text x='460' y='230' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>• 2 diagonales</text><text x='260' y='380' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>Un cuadrado tiene 4 ejes de simetría</text>
</svg>