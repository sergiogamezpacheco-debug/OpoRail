<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Cubo pintado — Identifica las caras opuestas</text>
  <!-- Cube showing 3 faces with different colors/patterns -->
  <g transform="translate(30,30)">
    <!-- Top face: red -->
    <polygon points="30,0 90,20 60,40 0,20" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="43" y="24" text-anchor="middle" font-size="9" fill="#dc2626" font-family="Arial">ROJO</text>
    <!-- Front face: blue with dots -->
    <polygon points="0,20 0,80 30,100 60,40 0,20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="68" text-anchor="middle" font-size="9" fill="#1e40af" font-family="Arial">AZUL</text>
    <circle cx="22" cy="55" r="5" fill="#2563eb"/>
    <!-- Right face: green with stripe -->
    <polygon points="60,40 90,20 90,80 30,100" fill="#d1fae5" stroke="#16a34a" stroke-width="2"/>
    <line x1="63" y1="55" x2="88" y2="42" stroke="#16a34a" stroke-width="3"/>
    <text x="72" y="80" text-anchor="middle" font-size="9" fill="#065f46" font-family="Arial">VERDE</text>
    <text x="45" y="118" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Vistas: ROJO / AZUL / VERDE</text>
  </g>
  <!-- Question -->
  <text x="200" y="60" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Cara opuesta a ROJO:</text>
  <rect x="165" y="70" width="70" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="200" y="85" text-anchor="middle" font-size="10" fill="#d97706" font-family="Arial">AMARILLO</text>
  <text x="200" y="115" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Cara opuesta a AZUL:</text>
  <rect x="165" y="125" width="70" height="22" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" rx="3"/>
  <text x="200" y="140" text-anchor="middle" font-size="10" fill="#7c3aed" font-family="Arial">MORADO</text>
  <text x="200" y="165" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Cara opuesta a VERDE:</text>
  <rect x="165" y="175" width="70" height="18" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
  <text x="200" y="188" text-anchor="middle" font-size="9" fill="#dc2626" font-family="Arial">NARANJA</text>
</svg>