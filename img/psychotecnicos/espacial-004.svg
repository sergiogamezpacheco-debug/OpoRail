  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>4. En un 3×3×3, ¿cuántos cubitos ven exactamente 3 caras externas?</text>
  <polygon points='260.0,80.0 380.0,140.0 260.0,200.0 140.0,140.0' fill='#d0d8e8' stroke='#334' stroke-width='2'/><polygon points='140.0,140.0 260.0,200.0 260.0,320.0 140.0,260.0' fill='#a8b8c8' stroke='#334' stroke-width='2'/><polygon points='380.0,140.0 260.0,200.0 260.0,320.0 380.0,260.0' fill='#bfcfdf' stroke='#334' stroke-width='2'/><circle cx='150' cy='155' r='16' fill='#ffdd88' stroke='#c08010' stroke-width='2'/><circle cx='375' cy='155' r='16' fill='#ffdd88' stroke='#c08010' stroke-width='2'/><circle cx='260' cy='100' r='16' fill='#ffdd88' stroke='#c08010' stroke-width='2'/><text x='500' y='190' font-family='Arial' font-size='20' text-anchor='middle' fill='#c00' font-weight='bold'>8 esquinas</text><text x='500' y='215' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>(vértices del cubo)</text><text x='500' y='240' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>Cada esquina ve</text><text x='500' y='260' font-family='Arial' font-size='14' text-anchor='middle' fill='#c00' font-weight='bold'>3 caras externas</text><text x='360' y='370' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>3×3×3 → 8 cubitos en esquinas con exactamente 3 caras visibles</text>
