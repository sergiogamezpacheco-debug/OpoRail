<svg xmlns='http://www.w3.org/2000/svg' width='640' height='248' viewBox='0 0 640 248' font-family='Arial,sans-serif'>
  <defs>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='2' dy='2' stdDeviation='3' flood-color='#00000033'/>
    </filter>
  </defs>

  <rect width='100%' height='100%' fill='#f0f4f8'/>
  <text x='320' y='34' font-size='18' font-weight='700' fill='#1f4a73' text-anchor='middle'>Instrucciones — Semáforos (Tabla de referencia A)</text>
  <text x='320' y='56' font-size='13' fill='#455a64' text-anchor='middle'>Aspecto del semáforo según la luz encendida</text>

  <!-- SEMAPHORE 1 — Parada (cx=110, red ON) -->
  <rect x='86' y='78' width='48' height='108' rx='6' fill='#1a1a1a' filter='url(#shadow)'/>
  <!-- Red ON -->
  <circle cx='110' cy='102' r='14' fill='#e53935'/>
  <!-- Amber OFF -->
  <circle cx='110' cy='134' r='14' fill='#333'/>
  <!-- Green OFF -->
  <circle cx='110' cy='166' r='14' fill='#333'/>
  <!-- Post -->
  <rect x='107' y='186' width='6' height='18' fill='#546e7a'/>
  <!-- Label -->
  <text x='110' y='216' font-size='12' font-weight='700' fill='#c62828' text-anchor='middle'>Parada</text>

  <!-- SEMAPHORE 2 — Precaución (cx=250, amber ON) -->
  <rect x='226' y='78' width='48' height='108' rx='6' fill='#1a1a1a' filter='url(#shadow)'/>
  <!-- Red OFF -->
  <circle cx='250' cy='102' r='14' fill='#333'/>
  <!-- Amber ON -->
  <circle cx='250' cy='134' r='14' fill='#FFA000'/>
  <!-- Green OFF -->
  <circle cx='250' cy='166' r='14' fill='#333'/>
  <!-- Post -->
  <rect x='247' y='186' width='6' height='18' fill='#546e7a'/>
  <!-- Label -->
  <text x='250' y='216' font-size='12' font-weight='700' fill='#E65100' text-anchor='middle'>Precaución</text>

  <!-- SEMAPHORE 3 — Vía libre (cx=390, green ON) -->
  <rect x='366' y='78' width='48' height='108' rx='6' fill='#1a1a1a' filter='url(#shadow)'/>
  <!-- Red OFF -->
  <circle cx='390' cy='102' r='14' fill='#333'/>
  <!-- Amber OFF -->
  <circle cx='390' cy='134' r='14' fill='#333'/>
  <!-- Green ON -->
  <circle cx='390' cy='166' r='14' fill='#43a047'/>
  <!-- Post -->
  <rect x='387' y='186' width='6' height='18' fill='#546e7a'/>
  <!-- Label -->
  <text x='390' y='216' font-size='12' font-weight='700' fill='#2e7d32' text-anchor='middle'>Vía libre</text>

  <!-- SEMAPHORE 4 — Anuncio parada (cx=530, red+amber ON) -->
  <rect x='506' y='78' width='48' height='108' rx='6' fill='#1a1a1a' filter='url(#shadow)'/>
  <!-- Red ON -->
  <circle cx='530' cy='102' r='14' fill='#e53935'/>
  <!-- Amber ON -->
  <circle cx='530' cy='134' r='14' fill='#FFA000'/>
  <!-- Green OFF -->
  <circle cx='530' cy='166' r='14' fill='#333'/>
  <!-- Post -->
  <rect x='527' y='186' width='6' height='18' fill='#546e7a'/>
  <!-- Label (2 lines) -->
  <text x='530' y='210' font-size='12' font-weight='700' fill='#6a1a6a' text-anchor='middle'>Anuncio</text>
  <text x='530' y='224' font-size='12' font-weight='700' fill='#6a1a6a' text-anchor='middle'>parada</text>
</svg>
