<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="520" height="220" fill="#f8f9fa" rx="10"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Semáforos — Tabla de fases</text>

  <!-- Semaphore A -->
  <!-- Housing -->
  <rect x="30" y="35" width="50" height="130" fill="#1f2937" rx="8"/>
  <text x="55" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sem. A</text>
  <!-- Red light -->
  <circle cx="55" cy="65" r="17" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <text x="55" y="70" text-anchor="middle" font-size="9" fill="white" font-weight="bold">ROJO</text>
  <!-- Yellow light (off) -->
  <circle cx="55" cy="100" r="17" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <text x="55" y="105" text-anchor="middle" font-size="9" fill="#6b7280">ÁMBAR</text>
  <!-- Green light (off) -->
  <circle cx="55" cy="135" r="17" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <text x="55" y="140" text-anchor="middle" font-size="9" fill="#6b7280">VERDE</text>
  <text x="55" y="180" text-anchor="middle" font-size="10" fill="#6b7280">Fase 1</text>
  <text x="55" y="193" text-anchor="middle" font-size="9" fill="#dc2626">STOP</text>

  <!-- Semaphore B -->
  <rect x="120" y="35" width="50" height="130" fill="#1f2937" rx="8"/>
  <text x="145" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sem. B</text>
  <!-- Red+Yellow (preparation) -->
  <circle cx="145" cy="65" r="17" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="70" text-anchor="middle" font-size="9" fill="white" font-weight="bold">ROJO</text>
  <circle cx="145" cy="100" r="17" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="105" text-anchor="middle" font-size="8" fill="#78350f" font-weight="bold">ÁMBAR</text>
  <circle cx="145" cy="135" r="17" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="140" text-anchor="middle" font-size="9" fill="#6b7280">VERDE</text>
  <text x="145" y="180" text-anchor="middle" font-size="10" fill="#6b7280">Fase 2</text>
  <text x="145" y="193" text-anchor="middle" font-size="9" fill="#d97706">PREPARAR</text>

  <!-- Semaphore C -->
  <rect x="210" y="35" width="50" height="130" fill="#1f2937" rx="8"/>
  <text x="235" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sem. C</text>
  <circle cx="235" cy="65" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="235" y="70" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <circle cx="235" cy="100" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="235" y="105" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <circle cx="235" cy="135" r="17" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <text x="235" y="140" text-anchor="middle" font-size="9" fill="white" font-weight="bold">VERDE</text>
  <text x="235" y="180" text-anchor="middle" font-size="10" fill="#6b7280">Fase 3</text>
  <text x="235" y="193" text-anchor="middle" font-size="9" fill="#16a34a">PASO</text>

  <!-- Semaphore D -->
  <rect x="300" y="35" width="50" height="130" fill="#1f2937" rx="8"/>
  <text x="325" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sem. D</text>
  <circle cx="325" cy="65" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="325" y="70" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <circle cx="325" cy="100" r="17" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <text x="325" y="105" text-anchor="middle" font-size="8" fill="#78350f" font-weight="bold">ÁMBAR</text>
  <circle cx="325" cy="135" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="325" y="140" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <text x="325" y="180" text-anchor="middle" font-size="10" fill="#6b7280">Fase 4</text>
  <text x="325" y="193" text-anchor="middle" font-size="9" fill="#d97706">PRECAUCIÓN</text>

  <!-- Semaphore E - intermittent amber -->
  <rect x="390" y="35" width="50" height="130" fill="#1f2937" rx="8"/>
  <text x="415" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Sem. E</text>
  <circle cx="415" cy="65" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="415" y="70" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <!-- Intermittent amber with dashed border -->
  <circle cx="415" cy="100" r="17" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="415" y="104" text-anchor="middle" font-size="7" fill="#78350f" font-weight="bold">ÁMBAR</text>
  <text x="415" y="112" text-anchor="middle" font-size="7" fill="#78350f">intermit.</text>
  <circle cx="415" cy="135" r="17" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="415" y="140" text-anchor="middle" font-size="9" fill="#6b7280">apagado</text>
  <text x="415" y="180" text-anchor="middle" font-size="10" fill="#6b7280">Fase 5</text>
  <text x="415" y="193" text-anchor="middle" font-size="9" fill="#d97706">NOCTURNO</text>

  <!-- Sequence arrow -->
  <text x="90" y="105" text-anchor="middle" font-size="16" fill="#374151">→</text>
  <text x="180" y="105" text-anchor="middle" font-size="16" fill="#374151">→</text>
  <text x="270" y="105" text-anchor="middle" font-size="16" fill="#374151">→</text>
  <text x="360" y="105" text-anchor="middle" font-size="16" fill="#374151">→</text>

  <!-- Sequence label -->
  <text x="260" y="213" text-anchor="middle" font-size="10" fill="#6b7280">Secuencia estándar: ROJO → ROJO+ÁMBAR → VERDE → ÁMBAR → ROJO</text>
</svg>
