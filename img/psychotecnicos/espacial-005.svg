<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>5. 8 vértices, 12 aristas, 6 caras — ¿qué figura es?</text>
  <polygon points='260.0,90.0 370.0,145.0 260.0,200.0 150.0,145.0' fill='#d0d8e8' stroke='#334' stroke-width='2'/><polygon points='150.0,145.0 260.0,200.0 260.0,310.0 150.0,255.0' fill='#a8b8c8' stroke='#334' stroke-width='2'/><polygon points='370.0,145.0 260.0,200.0 260.0,310.0 370.0,255.0' fill='#bfcfdf' stroke='#334' stroke-width='2'/><text x='120' y='120' font-family='Arial' font-size='14' text-anchor='middle' fill='#c00' font-weight='normal'>⬟ 8 vértices</text><text x='120' y='145' font-family='Arial' font-size='14' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>— 12 aristas</text><text x='120' y='170' font-family='Arial' font-size='14' text-anchor='middle' fill='#1a3a8c' font-weight='normal'>▭ 6 caras</text><rect x='420' y='140' width='260' height='90' rx='8' fill='#e0f0e8' stroke='#2a5a3c' stroke-width='2'/><text x='550' y='168' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Fórmula de Euler:</text><text x='550' y='190' font-family='Arial' font-size='15' text-anchor='middle' fill='#2a5a2a' font-weight='bold'>V − A + C = 2</text><text x='550' y='210' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>8 − 12 + 6 = 2  ✓</text><text x='360' y='360' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='bold'>→ La figura es un CUBO</text>
</svg>