<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Desarrollo del cubo — ¿Qué cubo se forma?</text>
  <!-- Net of a cube (cross pattern) -->
  <g transform="translate(20,25)">
    <!-- Top -->
    <rect x="45" y="0" width="45" height="45" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="67" y="27" text-anchor="middle" font-size="18" fill="#374151">★</text>
    <!-- Middle row: Left, Front, Right, Back -->
    <rect x="0" y="45" width="45" height="45" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="22" cy="67" r="10" fill="#2563eb"/>
    <rect x="45" y="45" width="45" height="45" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="67" y="72" text-anchor="middle" font-size="14" fill="#374151" font-family="Arial">+</text>
    <rect x="90" y="45" width="45" height="45" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="112" y="72" text-anchor="middle" font-size="16" fill="#374151">▲</text>
    <rect x="135" y="45" width="45" height="45" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="157" y="72" text-anchor="middle" font-size="14" fill="#374151">■</text>
    <!-- Bottom -->
    <rect x="45" y="90" width="45" height="45" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="67" y="117" text-anchor="middle" font-size="14" fill="#374151">●</text>
  </g>
  <!-- Arrow -->
  <text x="205" y="95" text-anchor="middle" font-size="20" fill="#374151">→</text>
  <!-- Assembled cube options (isometric) -->
  <g transform="translate(220,50)">
    <!-- Cube showing star on top, circle on front, triangle on right -->
    <polygon points="0,40 30,20 60,40 30,60" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="30" y="42" text-anchor="middle" font-size="14" fill="#374151">★</text>
    <polygon points="0,40 0,80 30,100 30,60" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="14" y="75" text-anchor="middle" font-size="12" fill="#374151">+</text>
    <polygon points="60,40 60,80 30,100 30,60" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="46" y="75" text-anchor="middle" font-size="12" fill="#374151">▲</text>
    <text x="30" y="118" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">¿Es esta la correcta?</text>
  </g>
  <text x="150" y="185" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Identifica la cara opuesta a la estrella (●)</text>
</svg>