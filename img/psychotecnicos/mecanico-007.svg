<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Vasos comunicantes</text>
  <!-- Left tube -->
  <rect x="60" y="40" width="40" height="100" fill="none" stroke="#6b7280" stroke-width="2"/>
  <!-- Right tube -->
  <rect x="200" y="40" width="40" height="100" fill="none" stroke="#6b7280" stroke-width="2"/>
  <!-- Connecting pipe -->
  <rect x="100" y="120" width="100" height="20" fill="none" stroke="#6b7280" stroke-width="2"/>
  <!-- Water left (higher due to added weight? No, equal) -->
  <rect x="61" y="78" width="38" height="62" fill="#93c5fd" opacity="0.7"/>
  <!-- Water right -->
  <rect x="201" y="78" width="38" height="62" fill="#93c5fd" opacity="0.7"/>
  <!-- Water connecting -->
  <rect x="101" y="121" width="98" height="18" fill="#93c5fd" opacity="0.7"/>
  <!-- Level line -->
  <line x1="50" y1="78" x2="255" y2="78" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="265" y="81" text-anchor="start" font-size="9" fill="#2563eb" font-family="Arial">nivel</text>
  <!-- Pressure arrow left -->
  <line x1="80" y1="55" x2="80" y2="75" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="80,77 74,63 86,63" fill="#ef4444"/>
  <text x="80" y="50" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">+F</text>
  <text x="150" y="168" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Si aplico fuerza en A, ¿qué ocurre en B?</text>
</svg>