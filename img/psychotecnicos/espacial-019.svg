<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190">
  <rect width="300" height="190" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Dominó girado — ¿Cuál es la posición equivalente?</text>
  <!-- Original domino [2|6] vertical -->
  <rect x="40" y="30" width="50" height="110" fill="white" stroke="#374151" stroke-width="2.5" rx="5"/>
  <line x1="40" y1="85" x2="90" y2="85" stroke="#374151" stroke-width="2"/>
  <!-- 2 top -->
  <circle cx="57" cy="50" r="5.5" fill="#374151"/>
  <circle cx="73" cy="68" r="5.5" fill="#374151"/>
  <!-- 6 bottom -->
  <circle cx="57" cy="97" r="5" fill="#374151"/><circle cx="73" cy="97" r="5" fill="#374151"/>
  <circle cx="57" cy="112" r="5" fill="#374151"/><circle cx="73" cy="112" r="5" fill="#374151"/>
  <circle cx="57" cy="127" r="5" fill="#374151"/><circle cx="73" cy="127" r="5" fill="#374151"/>
  <text x="65" y="155" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">[2|6] vertical</text>

  <text x="120" y="90" text-anchor="middle" font-size="14" fill="#374151">giro↻</text>
  <text x="120" y="106" text-anchor="middle" font-size="11" fill="#374151">90°</text>

  <!-- Option A: [2|6] horizontal (correct rotation) -->
  <rect x="150" y="60" width="110" height="50" fill="white" stroke="#374151" stroke-width="2" rx="5"/>
  <line x1="205" y1="60" x2="205" y2="110" stroke="#374151" stroke-width="2"/>
  <!-- 2 left -->
  <circle cx="170" cy="75" r="5" fill="#374151"/>
  <circle cx="190" cy="93" r="5" fill="#374151"/>
  <!-- 6 right -->
  <circle cx="215" cy="68" r="4.5" fill="#374151"/><circle cx="250" cy="68" r="4.5" fill="#374151"/>
  <circle cx="215" cy="85" r="4.5" fill="#374151"/><circle cx="250" cy="85" r="4.5" fill="#374151"/>
  <circle cx="215" cy="102" r="4.5" fill="#374151"/><circle cx="250" cy="102" r="4.5" fill="#374151"/>
  <text x="205" y="128" text-anchor="middle" font-size="10" fill="#16a34a" font-family="Arial">A — [2|6] horizontal ✓</text>

  <!-- Option B: [6|2] wrong order -->
  <rect x="150" y="145" width="110" height="38" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="4" stroke-dasharray="4,2"/>
  <line x1="205" y1="145" x2="205" y2="183" stroke="#374151" stroke-width="1.5"/>
  <!-- 6 left -->
  <circle cx="163" cy="155" r="4" fill="#374151"/><circle cx="178" cy="155" r="4" fill="#374151"/>
  <circle cx="163" cy="164" r="4" fill="#374151"/><circle cx="178" cy="164" r="4" fill="#374151"/>
  <!-- 2 right -->
  <circle cx="220" cy="155" r="4" fill="#374151"/>
  <circle cx="240" cy="168" r="4" fill="#374151"/>
  <text x="205" y="190" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial">B — [6|2] incorrecto</text>
</svg>