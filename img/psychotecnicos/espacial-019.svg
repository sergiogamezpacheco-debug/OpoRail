<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>19. ¿Cuántos vértices tiene un prisma triangular?</text>
  <polygon points='260,215 440,215 350,95' fill='#c0ccd8' stroke='#334' stroke-width='2'/><polygon points='130,280 310,280 220,160' fill='#d0dce8' stroke='#334' stroke-width='2'/><line x1='130' y1='280' x2='260' y2='215' stroke='#334' stroke-width='2'/><line x1='310' y1='280' x2='440' y2='215' stroke='#334' stroke-width='2'/><line x1='220' y1='160' x2='350' y2='95' stroke='#334' stroke-width='2'/><circle cx='130' cy='280' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='130' y='265' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>1</text><circle cx='310' cy='280' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='325' y='265' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>2</text><circle cx='220' cy='160' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='235' y='145' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>3</text><circle cx='260' cy='215' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='260' y='235' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>4</text><circle cx='440' cy='215' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='455' y='235' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>5</text><circle cx='350' cy='95' r='8' fill='#c00' stroke='#800' stroke-width='1.5'/><text x='365' y='115' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='bold'>6</text><text x='500' y='200' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>Prisma triangular:</text><text x='500' y='228' font-family='Arial' font-size='20' text-anchor='middle' fill='#c00' font-weight='bold'>6 vértices</text><text x='500' y='258' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>(3 en cada base)</text><text x='500' y='285' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>9 aristas, 5 caras</text><text x='360' y='380' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Prisma triangular: 2 triángulos base + 3 rectángulos laterales</text>
