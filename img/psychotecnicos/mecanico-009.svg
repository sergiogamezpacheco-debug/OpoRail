<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Prensa hidráulica — Principio de Pascal</text>
  <!-- Left piston (small) -->
  <rect x="55" y="50" width="40" height="15" fill="#9ca3af" stroke="#374151" stroke-width="1.5" rx="1"/>
  <rect x="65" y="30" width="20" height="20" fill="#6b7280" stroke="#374151" stroke-width="1.5" rx="1"/>
  <!-- Left cylinder -->
  <rect x="55" y="65" width="40" height="80" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <!-- Right piston (large) -->
  <rect x="185" y="50" width="70" height="15" fill="#9ca3af" stroke="#374151" stroke-width="1.5" rx="1"/>
  <rect x="200" y="30" width="40" height="20" fill="#6b7280" stroke="#374151" stroke-width="1.5" rx="1"/>
  <!-- Right cylinder -->
  <rect x="185" y="65" width="70" height="80" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <!-- Connecting pipe at bottom -->
  <rect x="95" y="130" width="90" height="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <!-- Effort label -->
  <line x1="75" y1="20" x2="75" y2="29" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="75,30 69,18 81,18" fill="#ef4444"/>
  <text x="75" y="14" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">f (pequeña)</text>
  <!-- Load label -->
  <line x1="220" y1="20" x2="220" y2="29" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="220,30 214,18 226,18" fill="#16a34a"/>
  <text x="230" y="14" text-anchor="middle" font-size="10" fill="#16a34a" font-family="Arial">F (grande)</text>
  <!-- Area labels -->
  <text x="75" y="115" text-anchor="middle" font-size="9" fill="#1e40af" font-family="Arial">A₁=10 cm²</text>
  <text x="220" y="115" text-anchor="middle" font-size="9" fill="#1e40af" font-family="Arial">A₂=100 cm²</text>
  <text x="150" y="170" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">f/A₁ = F/A₂ → F = f × (A₂/A₁)</text>
  <text x="150" y="185" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Si f = 10 N, ¿cuánto vale F?</text>
</svg>