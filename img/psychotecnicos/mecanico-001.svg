<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Engranajes — Rueda A impulsa Rueda B</text>
  <!-- Gear A (driver, 12 teeth, larger) -->
  <g transform="translate(90,95)">
    <circle r="38" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <circle r="30" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>
    <circle r="5" fill="#374151"/>
    <!-- Teeth A -->
    <g fill="#9ca3af" stroke="#6b7280" stroke-width="1">
      <rect x="-4" y="-45" width="8" height="10" rx="1"/>
      <rect x="-4" y="35" width="8" height="10" rx="1" transform="rotate(180,0,0)"/>
      <rect x="-45" y="-4" width="10" height="8" rx="1"/>
      <rect x="35" y="-4" width="10" height="8" rx="1"/>
      <rect x="-34" y="-29" width="8" height="10" rx="1" transform="rotate(-45,0,0)"/>
      <rect x="26" y="-33" width="8" height="10" rx="1" transform="rotate(45,0,0)"/>
      <rect x="-34" y="19" width="8" height="10" rx="1" transform="rotate(-135,0,0)"/>
      <rect x="26" y="23" width="8" height="10" rx="1" transform="rotate(135,0,0)"/>
    </g>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" font-family="Arial">A</text>
    <!-- Arrow showing direction (CW) -->
    <path d="M 32,-15 A 34,34 0 0,1 15,32" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>
  </g>
  <!-- Gear B (driven, 8 teeth, smaller) -->
  <g transform="translate(200,95)">
    <circle r="26" fill="#dbeafe" stroke="#6b7280" stroke-width="2"/>
    <circle r="19" fill="#bfdbfe" stroke="#6b7280" stroke-width="1.5"/>
    <circle r="4" fill="#374151"/>
    <!-- Teeth B -->
    <g fill="#93c5fd" stroke="#6b7280" stroke-width="1">
      <rect x="-3" y="-30" width="6" height="8" rx="1"/>
      <rect x="-3" y="22" width="6" height="8" rx="1" transform="rotate(180,0,0)"/>
      <rect x="-30" y="-3" width="8" height="6" rx="1"/>
      <rect x="22" y="-3" width="8" height="6" rx="1"/>
      <rect x="-22" y="-20" width="6" height="8" rx="1" transform="rotate(-45,0,0)"/>
      <rect x="14" y="-22" width="6" height="8" rx="1" transform="rotate(45,0,0)"/>
      <rect x="-22" y="12" width="6" height="8" rx="1" transform="rotate(-135,0,0)"/>
      <rect x="14" y="14" width="6" height="8" rx="1" transform="rotate(135,0,0)"/>
    </g>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af" font-family="Arial">B</text>
    <!-- Arrow showing direction (CCW, opposite) -->
    <path d="M 18,-12 A 22,22 0 0,0 10,20" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr2)"/>
  </g>
  <!-- Contact point -->
  <circle cx="152" cy="95" r="3" fill="#ef4444"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="90" y="158" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">12 dientes (↻)</text>
  <text x="200" y="158" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">8 dientes (?)</text>
</svg>