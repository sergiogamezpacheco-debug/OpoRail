<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>18. F = m × a — ¿Qué ley física describe esta ecuación?</text>
  <rect x='200' y='210' width='320' height='100' rx='6' fill='#c8d0d8' stroke='#445' stroke-width='3'/><text x='360' y='267' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>m = 10 kg</text><line x1='120' y1='310' x2='600' y2='310' stroke='#777' stroke-width='3'/><line x1='120' y1='260' x2='200' y2='260' stroke='#c00' stroke-width='2.5'/><polygon points='200.0,260.0 188.0,266.0 188.0,254.0' fill='#c00'/><text x='90' y='258' font-family='Arial' font-size='16' text-anchor='middle' fill='#c00' font-weight='bold'>F</text><line x1='520' y1='260' x2='620' y2='260' stroke='#2a5a2a' stroke-width='2.5'/><polygon points='620.0,260.0 608.0,266.0 608.0,254.0' fill='#2a5a2a'/><text x='640' y='264' font-family='Arial' font-size='16' text-anchor='middle' fill='#2a5a2a' font-weight='bold'>a</text><rect x='160' y='340' width='400' height='60' rx='10' fill='#e0f0e8' stroke='#2a5a2a' stroke-width='2'/><text x='360' y='368' font-family='Arial' font-size='22' text-anchor='middle' fill='#2a5a2a' font-weight='bold'>F = m × a</text><text x='360' y='392' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>2ª Ley de Newton</text><text x='360' y='130' font-family='Arial' font-size='15' text-anchor='middle' fill='#333' font-weight='normal'>¿Qué ley enuncia que la fuerza neta = masa × aceleración?</text>
</svg>