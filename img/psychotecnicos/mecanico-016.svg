<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Resorte — Ley de Hooke: F = k·x</text>
  <!-- Spring natural length (left spring, uncompressed) -->
  <!-- Wall left -->
  <rect x="28" y="50" width="12" height="100" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Spring coils natural -->
  <path d="M 40,90 L 50,75 L 70,105 L 90,75 L 110,105 L 130,75 L 150,90" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <!-- Mass -->
  <rect x="150" y="73" width="30" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <text x="165" y="94" text-anchor="middle" font-size="10" fill="#1e40af" font-family="Arial">m</text>
  <!-- Arrow showing displacement x -->
  <line x1="40" y1="130" x2="148" y2="130" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="94" y="143" text-anchor="middle" font-size="9" fill="#ef4444" font-family="Arial">L₀ (longitud natural)</text>
  <!-- Second spring (compressed, right side) -->
  <rect x="188" y="50" width="12" height="100" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 200,90 L 208,78 L 220,102 L 232,78 L 244,102 L 256,78 L 265,90" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <!-- Compressed mass -->
  <rect x="200" y="73" width="30" height="34" fill="#fecaca" stroke="#ef4444" stroke-width="1.5" rx="2"/>
  <text x="215" y="94" text-anchor="middle" font-size="10" fill="#991b1b" font-family="Arial">m</text>
  <!-- Force arrow -->
  <line x1="230" y1="90" x2="250" y2="90" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="252,90 238,84 238,96" fill="#ef4444"/>
  <text x="262" y="94" text-anchor="start" font-size="9" fill="#ef4444" font-family="Arial">F</text>
  <!-- x label -->
  <line x1="200" y1="140" x2="230" y2="140" stroke="#16a34a" stroke-width="1.5"/>
  <text x="215" y="153" text-anchor="middle" font-size="9" fill="#16a34a" font-family="Arial">x</text>
  <text x="150" y="175" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">k = constante del resorte (N/m)</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Si k=200 N/m y x=0,1 m → F=?</text>
</svg>