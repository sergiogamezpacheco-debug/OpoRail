<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Correa de transmisión — Poleas</text>
  <!-- Pulley A (driver, large) -->
  <circle cx="75" cy="95" r="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="75" cy="95" r="6" fill="#374151"/>
  <text x="75" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151" font-family="Arial">A</text>
  <!-- Pulley B (driven, small) -->
  <circle cx="225" cy="95" r="22" fill="#d1fae5" stroke="#16a34a" stroke-width="2"/>
  <circle cx="225" cy="95" r="4" fill="#374151"/>
  <text x="225" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151" font-family="Arial">B</text>
  <!-- Belt (top and bottom) -->
  <line x1="75" y1="55" x2="225" y2="73" stroke="#374151" stroke-width="3"/>
  <line x1="75" y1="135" x2="225" y2="117" stroke="#374151" stroke-width="3"/>
  <!-- Rotation arrows -->
  <path d="M 95,58 A 38,38 0 0,1 112,75" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#a10)"/>
  <path d="M 240,80 A 20,20 0 0,1 244,100" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a10b)"/>
  <defs>
    <marker id="a10" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a10b" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <text x="75" y="155" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">ø=80mm · 60rpm</text>
  <text x="225" y="155" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">ø=40mm · ?rpm</text>
  <text x="150" y="170" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">v_correa = v_A · r_A = v_B · r_B</text>
</svg>