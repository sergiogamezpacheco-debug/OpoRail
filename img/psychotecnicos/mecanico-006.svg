<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Tren de engranajes A→B→C</text>
  <!-- Gear A -->
  <circle cx="60" cy="95" r="30" fill="#fecaca" stroke="#6b7280" stroke-width="2"/>
  <circle cx="60" cy="95" r="5" fill="#374151"/>
  <text x="60" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151" font-family="Arial">A</text>
  <path d="M 60,63 A 32,32 0 0,1 88,80" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a6)"/>
  <!-- Gear B (small, between) -->
  <circle cx="140" cy="95" r="20" fill="#d1fae5" stroke="#6b7280" stroke-width="2"/>
  <circle cx="140" cy="95" r="4" fill="#374151"/>
  <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151" font-family="Arial">B</text>
  <!-- Gear C (large) -->
  <circle cx="225" cy="95" r="35" fill="#dbeafe" stroke="#6b7280" stroke-width="2"/>
  <circle cx="225" cy="95" r="5" fill="#374151"/>
  <text x="225" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151" font-family="Arial">C</text>
  <defs>
    <marker id="a6" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <text x="100" y="140" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">A:12d   B:8d   C:16d</text>
  <text x="150" y="162" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Si A gira a 120 rpm, ¿cuánto gira C?</text>
</svg>