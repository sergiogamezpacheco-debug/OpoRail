<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>11. Hidráulica: pistón A=10cm², B=50cm². Si F=10N en A, ¿fuerza en B?</text>
  <rect x='80' y='130' width='80' height='180' rx='5' fill='none' stroke='#555' stroke-width='3'/><rect x='90' y='160' width='60' height='20' fill='#7090c0'/><text x='120' y='148' font-family='Arial' font-size='14' text-anchor='middle' fill='#c00' font-weight='normal'>10 N</text><line x1='120' y1='160' x2='120' y2='175' stroke='#c00' stroke-width='2.5'/><polygon points='120.0,175.0 114.0,163.0 126.0,163.0' fill='#c00'/><text x='120' y='320' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>A = 10 cm²</text><rect x='160' y='280' width='250' height='25' fill='#a8c0e0' stroke='#446' stroke-width='2'/><text x='285' y='298' font-family='Arial' font-size='11' text-anchor='middle' fill='#446' font-weight='normal'>Fluido hidráulico</text><rect x='410' y='100' width='160' height='210' rx='5' fill='none' stroke='#555' stroke-width='3'/><rect x='420' y='135' width='140' height='25' fill='#7090c0'/><text x='490' y='128' font-family='Arial' font-size='15' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>F = ?</text><line x1='490' y1='130' x2='490' y2='135' stroke='#2a5a2a' stroke-width='2.5'/><polygon points='490.0,135.0 484.0,123.0 496.0,123.0' fill='#2a5a2a'/><text x='490' y='330' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>B = 50 cm²</text><line x1='160' y1='280' x2='410' y2='280' stroke='#a8c0e0' stroke-width='5'/><line x1='160' y1='305' x2='410' y2='305' stroke='#a8c0e0' stroke-width='5'/><text x='360' y='380' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>Ley Pascal: P=F/A → FA×AB/AA = 10×50/10 = 50 N</text>
</svg>