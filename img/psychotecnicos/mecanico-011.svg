<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Balanza en equilibrio</text>
  <!-- Vertical support -->
  <rect x="145" y="30" width="10" height="100" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Pivot -->
  <circle cx="150" cy="72" r="7" fill="#374151"/>
  <!-- Beam (balanced) -->
  <rect x="50" y="68" width="200" height="8" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <!-- Left pan -->
  <line x1="70" y1="76" x2="70" y2="105" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="45" y="105" width="50" height="5" fill="#9ca3af" stroke="#6b7280" stroke-width="1" rx="1"/>
  <!-- Right pan -->
  <line x1="230" y1="76" x2="230" y2="105" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="205" y="105" width="50" height="5" fill="#9ca3af" stroke="#6b7280" stroke-width="1" rx="1"/>
  <!-- Weights left -->
  <rect x="55" y="88" width="30" height="17" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" rx="2"/>
  <text x="70" y="100" text-anchor="middle" font-size="9" fill="#78350f" font-family="Arial">5 kg</text>
  <!-- Weights right -->
  <rect x="215" y="88" width="30" height="17" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <text x="230" y="100" text-anchor="middle" font-size="9" fill="#1e40af" font-family="Arial">? kg</text>
  <!-- Dimension arrows -->
  <line x1="70" y1="138" x2="150" y2="138" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="110" y="150" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">80 cm</text>
  <line x1="150" y1="138" x2="230" y2="138" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="190" y="150" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">80 cm</text>
  <text x="150" y="168" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">M₁ × d₁ = M₂ × d₂ → ¿equilibrio?</text>
</svg>