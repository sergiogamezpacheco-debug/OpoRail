<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>17. Cubo 3×3×3 pintado exterior, cortado en 27 — ¿cuántos con exactamente 2 caras?</text>
  <polygon points='180.0,90.0 280.0,140.0 180.0,190.0 80.0,140.0' fill='#ffaaaa' stroke='#334' stroke-width='2'/><polygon points='80.0,140.0 180.0,190.0 180.0,290.0 80.0,240.0' fill='#ee8888' stroke='#334' stroke-width='2'/><polygon points='280.0,140.0 180.0,190.0 180.0,290.0 280.0,240.0' fill='#ff9999' stroke='#334' stroke-width='2'/><text x='390' y='120' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>Cubitos con 2 caras pintadas:</text><text x='390' y='148' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>= aristas sin esquinas</text><text x='390' y='175' font-family='Arial' font-size='13' text-anchor='middle' fill='#c00' font-weight='normal'>12 aristas × 1 cubito</text><text x='390' y='202' font-family='Arial' font-size='20' text-anchor='middle' fill='#c00' font-weight='bold'>= 12 cubitos</text><rect x='380' y='230' width='290' height='95' rx='8' fill='#fffbe6' stroke='#c8a000' stroke-width='1.5'/><text x='525' y='255' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>Esquinas: 8 (3 caras pintadas)</text><text x='525' y='277' font-family='Arial' font-size='12' text-anchor='middle' fill='#c00' font-weight='normal'>Aristas: 12 (2 caras pintadas)  ← aquí</text><text x='525' y='299' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>Caras: 6 (1 cara pintada)</text><text x='525' y='319' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>Interior: 1 (0 caras pintadas)</text><text x='360' y='385' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>3×3×3 con todas caras pintadas: 12 cubitos con exactamente 2 caras</text>
</svg>