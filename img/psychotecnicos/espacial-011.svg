<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Papel plegado — ¿Cómo queda al doblarlo?</text>
  <!-- Step 1: flat square with dot top-right -->
  <rect x="20" y="35" width="70" height="70" fill="white" stroke="#374151" stroke-width="2"/>
  <circle cx="77" cy="42" r="7" fill="#374151"/>
  <text x="55" y="120" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">1. Hoja plana</text>
  <!-- Arrow + fold line -->
  <text x="110" y="73" text-anchor="middle" font-size="18" fill="#374151">→</text>
  <!-- Step 2: fold left half over right (fold line at center) -->
  <g transform="translate(130,35)">
    <rect x="0" y="0" width="35" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="35" y="0" width="35" height="70" fill="white" stroke="#374151" stroke-width="2"/>
    <line x1="35" y1="0" x2="35" y2="70" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="17" y="35" text-anchor="middle" font-size="9" fill="#2563eb" font-family="Arial">←</text>
    <text x="35" y="85" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">2. Doblar</text>
  </g>
  <!-- Arrow -->
  <text x="188" y="73" text-anchor="middle" font-size="18" fill="#374151">→</text>
  <!-- Step 3: result (dot now behind, visible through) -->
  <g transform="translate(200,35)">
    <rect x="0" y="0" width="35" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="8" cy="7" r="5" fill="#374151" opacity="0.3"/>
    <text x="17" y="85" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">3. Resultado</text>
  </g>
  <text x="150" y="145" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Al doblar, el punto queda en la parte trasera</text>
  <text x="150" y="162" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">¿En qué posición aparecería si perforamos?</text>
</svg>