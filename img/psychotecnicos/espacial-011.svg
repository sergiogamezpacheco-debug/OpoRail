<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>11. Barra circular doblada 90° — ¿qué forma tiene vista desde arriba?</text>
  <line x1='150' y1='250' x2='300' y2='250' stroke='#888' stroke-width='20' stroke-linecap='round'/><line x1='300' y1='250' x2='300' y2='100' stroke='#888' stroke-width='20' stroke-linecap='round'/><circle cx='300' cy='250' r='12' fill='#aaa' stroke='#555' stroke-width='2'/><text x='225' y='290' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Barra circular doblada 90°</text><text x='500' y='80' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>Vista desde arriba:</text><rect x='450' y='100' width='100' height='25' rx='8' fill='#888' stroke='#555' stroke-width='2'/><rect x='525' y='100' width='25' height='100' rx='8' fill='#888' stroke='#555' stroke-width='2'/><text x='500' y='225' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Vista en planta:</text><text x='500' y='248' font-family='Arial' font-size='16' text-anchor='middle' fill='#c00' font-weight='bold'>Forma de L</text><text x='360' y='380' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Barra redonda doblada 90° → vista superior = ángulo L</text>
</svg>