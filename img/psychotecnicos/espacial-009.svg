<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>9. Papel doblado, se corta un triángulo — ¿qué forma aparece al desdoblar?</text>
  <rect x='50' y='90' width='150' height='100' fill='#fffbe6' stroke='#c8a000' stroke-width='2'/><text x='125' y='210' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>1. Hoja</text><line x1='125' y1='90' x2='125' y2='190' stroke='#c00' stroke-width='2' stroke-dasharray='5 3'/><rect x='250' y='90' width='75' height='100' fill='#ffe0a0' stroke='#c8a000' stroke-width='2'/><rect x='325' y='90' width='75' height='100' fill='#ffe0a0' stroke='#c8a000' stroke-width='2' opacity='0.4'/><text x='300' y='210' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>2. Doblar</text><rect x='430' y='90' width='75' height='100' fill='#ffe0a0' stroke='#c8a000' stroke-width='2'/><polygon points='467,115 505,190 430,190' fill='#ccc' stroke='#444' stroke-width='1.5' stroke-dasharray='3 2'/><text x='468' y='210' font-family='Arial' font-size='12' text-anchor='middle' fill='#555' font-weight='normal'>3. Cortar △</text><polygon points='610,130 650,190 610,250 570,190' fill='none' stroke='#2a5a2a' stroke-width='3'/><text x='610' y='275' font-family='Arial' font-size='12' text-anchor='middle' fill='#2a5a2a' font-weight='normal'>4. Desdoblar →</text><text x='610' y='293' font-family='Arial' font-size='13' text-anchor='middle' fill='#2a5a2a' font-weight='bold'>Rombo ◇</text><text x='360' y='370' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>El triángulo cortado → al desdoblar aparecen 2 triángulos = rombo</text>
</svg>