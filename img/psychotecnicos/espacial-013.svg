<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170">
  <rect width="300" height="170" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Dominó — La segunda mitad es el doble de la primera</text>
  <!-- [1|2] [2|4] [3|6] [4|?] -->
  <g transform="translate(5,35)">
    <rect x="0" y="0" width="60" height="28" fill="white" stroke="#374151" stroke-width="2" rx="3"/>
    <line x1="30" y1="0" x2="30" y2="28" stroke="#374151" stroke-width="1.5"/>
    <circle cx="15" cy="14" r="5" fill="#374151"/>
    <circle cx="40" cy="8" r="4" fill="#374151"/><circle cx="50" cy="20" r="4" fill="#374151"/>
    <text x="30" y="42" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">[1|2]</text>

    <rect x="70" y="0" width="60" height="28" fill="white" stroke="#374151" stroke-width="2" rx="3"/>
    <line x1="100" y1="0" x2="100" y2="28" stroke="#374151" stroke-width="1.5"/>
    <circle cx="85" cy="8" r="4" fill="#374151"/><circle cx="85" cy="20" r="4" fill="#374151"/>
    <circle cx="108" cy="7" r="3.5" fill="#374151"/><circle cx="116" cy="7" r="3.5" fill="#374151"/>
    <circle cx="108" cy="14" r="3.5" fill="#374151"/><circle cx="116" cy="14" r="3.5" fill="#374151"/>
    <text x="100" y="42" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">[2|4]</text>

    <rect x="140" y="0" width="60" height="28" fill="white" stroke="#374151" stroke-width="2" rx="3"/>
    <line x1="170" y1="0" x2="170" y2="28" stroke="#374151" stroke-width="1.5"/>
    <circle cx="155" cy="8" r="3.5" fill="#374151"/><circle cx="150" cy="14" r="3" fill="#374151"/>
    <circle cx="155" cy="20" r="3.5" fill="#374151"/>
    <circle cx="178" cy="6" r="3.5" fill="#374151"/><circle cx="186" cy="6" r="3.5" fill="#374151"/>
    <circle cx="178" cy="14" r="3.5" fill="#374151"/><circle cx="186" cy="14" r="3.5" fill="#374151"/>
    <circle cx="178" cy="22" r="3.5" fill="#374151"/><circle cx="186" cy="22" r="3.5" fill="#374151"/>
    <text x="170" y="42" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">[3|6]</text>

    <rect x="210" y="0" width="70" height="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" rx="3"/>
    <line x1="245" y1="0" x2="245" y2="28" stroke="#374151" stroke-width="1.5"/>
    <circle cx="225" cy="7" r="3.5" fill="#374151"/><circle cx="225" cy="21" r="3.5" fill="#374151"/>
    <circle cx="232" cy="14" r="3" fill="#374151"/><circle cx="232" cy="21" r="3" fill="#374151"/>
    <text x="262" y="18" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="bold" font-family="Arial">?</text>
    <text x="245" y="42" text-anchor="middle" font-size="9" fill="#16a34a" font-family="Arial">[4|?]</text>
  </g>
  <text x="150" y="100" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">Patrón: 2ª mitad = 2 × 1ª mitad</text>
  <text x="150" y="120" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">a) [4|6]   b) [4|7]   c) [4|8]   d) [4|9]</text>
</svg>