<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>13. ¿Cuántas caras tiene un cilindro de altura 10cm y diámetro 6cm?</text>
  <ellipse cx='220' cy='125' rx='80' ry='26' fill='#c8d8f0' stroke='#334' stroke-width='2'/><rect x='140' y='125' width='160' height='150' fill='#d0dce8' stroke='none'/><line x1='140' y1='125' x2='140' y2='275' stroke='#334' stroke-width='2'/><line x1='300' y1='125' x2='300' y2='275' stroke='#334' stroke-width='2'/><ellipse cx='220' cy='275' rx='80' ry='26' fill='#b8c8d8' stroke='#334' stroke-width='2'/><line x1='220' y1='120' x2='250' y2='110' stroke='#c00' stroke-width='2'/><polygon points='250.0,110.0 242.1,117.9 238.9,108.4' fill='#c00'/><text x='280' y='105' font-family='Arial' font-size='13' text-anchor='start' fill='#c00' font-weight='normal'>① Cara superior</text><line x1='300' y1='200' x2='330' y2='200' stroke='#2a5a2a' stroke-width='2'/><polygon points='330.0,200.0 320.0,205.0 320.0,195.0' fill='#2a5a2a'/><text x='335' y='205' font-family='Arial' font-size='13' text-anchor='start' fill='#2a5a2a' font-weight='normal'>② Cara lateral</text><line x1='220' y1='280' x2='250' y2='300' stroke='#7a2a9c' stroke-width='2'/><polygon points='250.0,300.0 238.9,298.6 244.5,290.3' fill='#7a2a9c'/><text x='280' y='305' font-family='Arial' font-size='13' text-anchor='start' fill='#7a2a9c' font-weight='normal'>③ Cara inferior</text><text x='500' y='230' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>Total:</text><text x='500' y='258' font-family='Arial' font-size='20' text-anchor='middle' fill='#c00' font-weight='bold'>3 caras</text><text x='360' y='380' font-family='Arial' font-size='13' text-anchor='middle' fill='#333' font-weight='normal'>Cilindro: 2 bases circulares + 1 cara lateral curva = 3 caras</text>
</svg>