<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Palanca de 1er grado — Fulcro central</text>
  <!-- Beam -->
  <rect x="30" y="88" width="240" height="8" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <!-- Fulcrum (triangle) -->
  <polygon points="150,96 135,130 165,130" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <line x1="120" y1="130" x2="180" y2="130" stroke="#374151" stroke-width="2"/>
  <!-- Force arrow left (down = effort) -->
  <line x1="60" y1="50" x2="60" y2="86" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="60,86 54,72 66,72" fill="#ef4444"/>
  <text x="60" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444" font-family="Arial">F</text>
  <!-- Load right (down) -->
  <line x1="240" y1="50" x2="240" y2="86" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="240,86 234,72 246,72" fill="#2563eb"/>
  <text x="240" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb" font-family="Arial">P</text>
  <!-- Dimension lines -->
  <line x1="60" y1="140" x2="150" y2="140" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="105" y="155" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">brazo F = 90 cm</text>
  <line x1="150" y1="140" x2="240" y2="140" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="195" y="155" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">brazo P = 90 cm</text>
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">F × brazo_F = P × brazo_P</text>
</svg>