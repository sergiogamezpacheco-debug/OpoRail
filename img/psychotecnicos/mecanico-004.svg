<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <rect width="300" height="220" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Polea móvil — Ventaja mecánica × 2</text>
  <!-- Ceiling -->
  <rect x="80" y="20" width="140" height="8" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Fixed rope from ceiling -->
  <line x1="110" y1="28" x2="110" y2="130" stroke="#6b7280" stroke-width="2"/>
  <!-- Mobile pulley -->
  <circle cx="150" cy="142" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="150" cy="142" r="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="150" cy="142" r="3" fill="#1e40af"/>
  <!-- Left side rope (fixed) -->
  <line x1="110" y1="130" x2="132" y2="142" stroke="#6b7280" stroke-width="2"/>
  <!-- Right side rope (effort) -->
  <line x1="168" y1="142" x2="200" y2="75" stroke="#374151" stroke-width="2"/>
  <!-- Effort arrow -->
  <line x1="200" y1="73" x2="200" y2="55" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="200,53 194,68 206,68" fill="#ef4444"/>
  <text x="218" y="62" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">F=P/2</text>
  <!-- Load hanging below pulley -->
  <line x1="150" y1="160" x2="150" y2="175" stroke="#374151" stroke-width="2"/>
  <rect x="130" y="175" width="40" height="25" fill="#fecaca" stroke="#ef4444" stroke-width="1.5" rx="2"/>
  <text x="150" y="191" text-anchor="middle" font-size="10" fill="#991b1b" font-family="Arial">P</text>
  <text x="150" y="212" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Polea móvil: F = P/2 (2 tramos sostienen P)</text>
</svg>