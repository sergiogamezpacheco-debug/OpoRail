<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Tornillo sin fin — Gran reducción de velocidad</text>
  <!-- Worm screw (horizontal cylinder) -->
  <ellipse cx="80" cy="95" rx="15" ry="35" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="65" y="60" width="80" height="70" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Helix lines on screw -->
  <path d="M 65,70 Q 85,80 105,70 Q 125,60 145,70" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 65,82 Q 85,92 105,82 Q 125,72 145,82" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 65,94 Q 85,104 105,94 Q 125,84 145,94" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 65,106 Q 85,116 105,106 Q 125,96 145,106" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 65,118 Q 85,128 105,118 Q 125,108 145,118" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- Worm gear (vertical circle) -->
  <circle cx="195" cy="95" r="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="195" cy="95" r="35" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <circle cx="195" cy="95" r="6" fill="#374151"/>
  <text x="195" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial">B</text>
  <!-- Rotation arrow -->
  <path d="M 210,55 A 40,40 0 0,1 235,90" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a8)"/>
  <defs><marker id="a8" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <text x="150" y="162" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">1 vuelta del tornillo = 1 diente del engranaje B</text>
</svg>