<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Polea fija — Cambia dirección de la fuerza</text>
  <!-- Ceiling -->
  <rect x="100" y="20" width="100" height="8" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Axle -->
  <line x1="150" y1="28" x2="150" y2="40" stroke="#374151" stroke-width="2"/>
  <!-- Pulley wheel -->
  <circle cx="150" cy="58" r="18" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <circle cx="150" cy="58" r="7" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="150" cy="58" r="3" fill="#374151"/>
  <!-- Left rope (effort side, upward force) -->
  <line x1="132" y1="58" x2="110" y2="140" stroke="#374151" stroke-width="2"/>
  <!-- Right rope (load side) -->
  <line x1="168" y1="58" x2="190" y2="140" stroke="#374151" stroke-width="2"/>
  <!-- Effort arrow (up on left side) -->
  <line x1="110" y1="160" x2="110" y2="142" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="110,140 104,155 116,155" fill="#ef4444"/>
  <text x="90" y="175" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">F (↑)</text>
  <!-- Load hanging on right -->
  <rect x="175" y="140" width="30" height="22" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <text x="190" y="155" text-anchor="middle" font-size="10" fill="#1e40af" font-family="Arial">P</text>
  <text x="150" y="190" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Polea fija: F = P (sin ventaja mecánica)</text>
</svg>