<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Pentominós — ¿Qué pieza completa el rectángulo?</text>
  <!-- 4x5 rectangle to fill -->
  <g transform="translate(20,30)">
    <rect x="0" y="0" width="100" height="120" fill="#f3f4f6" stroke="#374151" stroke-width="2" rx="2"/>
    <!-- Filled part (L pentomino) -->
    <rect x="0" y="0" width="40" height="120" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" rx="0"/>
    <rect x="40" y="80" width="60" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <!-- Remaining hole shape -->
    <rect x="40" y="0" width="60" height="80" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="70" y="44" text-anchor="middle" font-size="10" fill="#d97706" font-family="Arial">HUECO</text>
    <text x="50" y="148" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Figura base (2×5 grid)</text>
  </g>
  <!-- Arrow -->
  <text x="140" y="90" text-anchor="middle" font-size="18" fill="#374151">←</text>
  <!-- Options -->
  <!-- Piece A: correct 3×4 L-block -->
  <g transform="translate(158,30)">
    <rect x="0" y="0" width="60" height="80" fill="#fef9c3" stroke="#d97706" stroke-width="2" rx="2"/>
    <text x="30" y="46" text-anchor="middle" font-size="10" fill="#92400e" font-family="Arial">3×4 rect</text>
    <text x="30" y="95" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">A ✓</text>
  </g>
  <!-- Piece B: wrong size -->
  <g transform="translate(230,30)">
    <rect x="0" y="0" width="40" height="80" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="2" stroke-dasharray="4,2"/>
    <text x="20" y="46" text-anchor="middle" font-size="10" fill="#dc2626" font-family="Arial">2×4</text>
    <text x="20" y="95" text-anchor="middle" font-size="10" fill="#dc2626" font-family="Arial">B ✗</text>
  </g>
  <text x="150" y="150" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">¿Qué pieza encaja exactamente en el hueco amarillo?</text>
</svg>