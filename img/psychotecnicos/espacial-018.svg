  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>18. ¿Qué proyección usan los planos técnicos industriales europeos?</text>
  <text x='360' y='65' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='bold'>Sistemas de proyección ortogonal</text><rect x='50' y='80' width='280' height='250' rx='6' fill='#e8f0f8' stroke='#3a5a8c' stroke-width='2'/><text x='190' y='105' font-family='Arial' font-size='13' text-anchor='middle' fill='#3a5a8c' font-weight='bold'>1er diedro (Europeo)</text><rect x='120' y='130' width='80' height='60' fill='#c8d8e8' stroke='#334' stroke-width='2'/><text x='160' y='163' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>FRENTE</text><rect x='120' y='200' width='80' height='40' fill='#d0dce8' stroke='#334' stroke-width='2'/><text x='160' y='225' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>PLANTA</text><rect x='60' y='130' width='50' height='60' fill='#b8c8d8' stroke='#334' stroke-width='2'/><text x='85' y='163' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>LAT</text><text x='190' y='300' font-family='Arial' font-size='11' text-anchor='middle' fill='#3a5a8c' font-weight='normal'>← Plano detrás del objeto</text><text x='190' y='318' font-family='Arial' font-size='11' text-anchor='middle' fill='#c00' font-weight='normal'>Vista lateral → a la IZQ</text><rect x='390' y='80' width='280' height='250' rx='6' fill='#f0e8e8' stroke='#8c3a3a' stroke-width='2'/><text x='530' y='105' font-family='Arial' font-size='13' text-anchor='middle' fill='#8c3a3a' font-weight='bold'>3er diedro (Americano)</text><rect x='460' y='130' width='80' height='60' fill='#e8d0d0' stroke='#334' stroke-width='2'/><text x='500' y='163' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>FRENTE</text><rect x='460' y='80' width='80' height='40' fill='#e0d8d0' stroke='#334' stroke-width='2'/><text x='500' y='103' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>PLANTA</text><rect x='550' y='130' width='50' height='60' fill='#d8c8c8' stroke='#334' stroke-width='2'/><text x='575' y='163' font-family='Arial' font-size='10' text-anchor='middle' fill='#334' font-weight='normal'>LAT</text><text x='530' y='300' font-family='Arial' font-size='11' text-anchor='middle' fill='#555' font-weight='normal'>Vista lateral → a la DER</text><text x='360' y='365' font-family='Arial' font-size='14' text-anchor='middle' fill='#1a5c2a' font-weight='bold'>→ Planos técnicos industriales europeos usan el 1er diedro</text>
