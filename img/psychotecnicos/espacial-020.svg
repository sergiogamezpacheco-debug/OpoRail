<svg xmlns='http://www.w3.org/2000/svg' width='720' height='420' viewBox='0 0 720 420'>
  <rect width='100%' height='100%' fill='#f8f9fa'/>
  <text x='20' y='35' font-family='Arial' font-size='17' font-weight='700' fill='#1a3a5c'>20. Hoja 20×10cm enrollada en cilindro — ¿qué diámetro tiene?</text>
  <rect x='60' y='80' width='220' height='110' fill='#ffe0a0' stroke='#c8a000' stroke-width='2'/><text x='170' y='145' font-family='Arial' font-size='13' text-anchor='middle' fill='#c8a000' font-weight='normal'>20 cm (longitud)</text><line x1='60' y1='200' x2='60' y2='215'/><line x1='280' y1='200' x2='280' y2='215'/><line x1='170' y1='50' x2='280' y2='80' stroke='#555' stroke-width='2'/><polygon points='280.0,80.0 269.0,82.2 271.7,72.5' fill='#555'/><line x1='60' y1='130' x2='55' y2='130'/><line x1='55' y1='80' x2='55' y2='190'/><text x='38' y='140' font-family='Arial' font-size='12' text-anchor='end' fill='#555' font-weight='normal'>10cm</text><text x='310' y='145' font-family='Arial' font-size='30' fill='#555'>→</text><ellipse cx='500' cy='100' rx='50' ry='16' fill='#d0d8e8' stroke='#334' stroke-width='2'/><rect x='450' y='100' width='100' height='110' fill='#d8e0e8' stroke='none'/><line x1='450' y1='100' x2='450' y2='210' stroke='#334' stroke-width='2'/><line x1='550' y1='100' x2='550' y2='210' stroke='#334' stroke-width='2'/><ellipse cx='500' cy='210' rx='50' ry='16' fill='#c8d0d8' stroke='#334' stroke-width='2'/><line x1='450' y1='235' x2='550' y2='235' stroke='#c00' stroke-width='2'/><polygon points='550.0,235.0 540.0,240.0 540.0,230.0' fill='#c00'/><line x1='550' y1='235' x2='450' y2='235' stroke='#c00' stroke-width='2'/><polygon points='450.0,235.0 460.0,230.0 460.0,240.0' fill='#c00'/><text x='500' y='255' font-family='Arial' font-size='14' text-anchor='middle' fill='#c00' font-weight='normal'>Ø = ?</text><rect x='60' y='280' width='620' height='60' rx='8' fill='#e0f0e8' stroke='#2a5a3c' stroke-width='1.5'/><text x='360' y='305' font-family='Arial' font-size='14' text-anchor='middle' fill='#333' font-weight='normal'>Longitud → circunferencia: L = π×d → d = 20/π ≈ 6,37 cm</text><text x='360' y='330' font-family='Arial' font-size='13' text-anchor='middle' fill='#555' font-weight='normal'>Altura del cilindro = 10 cm (lado corto de la hoja)</text>
</svg>