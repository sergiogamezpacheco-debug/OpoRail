<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f9fafb"/>
  <text x="150" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Construcción con cubos — ¿Cuántos cubos hay?</text>
  <!-- Isometric stacked cubes: 3-2-1 pyramid -->
  <g transform="translate(30,25)">
    <!-- Bottom layer: 3x3 = 9 cubes (showing 3 front + perspective) -->
    <!-- Row 1 back -->
    <polygon points="30,80 60,65 90,80 60,95" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <polygon points="60,65 90,50 120,65 90,80" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <polygon points="90,50 120,35 150,50 120,65" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <!-- Row 1 sides -->
    <polygon points="30,80 30,110 60,125 60,95" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <polygon points="90,80 90,110 120,95 120,65" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <polygon points="150,50 150,80 120,95 120,65" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <!-- Row 1 front tops and sides -->
    <polygon points="0,95 30,80 60,95 30,110" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <polygon points="0,95 0,125 30,140 30,110" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <polygon points="60,95 60,125 90,110 90,80" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <polygon points="30,110 60,95 90,110 60,125" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

    <!-- Second layer: 2x2 (4 cubes) -->
    <polygon points="30,55 60,40 90,55 60,70" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <polygon points="60,40 90,25 120,40 90,55" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <polygon points="30,55 30,80 60,95 60,70" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
    <polygon points="90,55 90,80 120,65 120,40" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
    <polygon points="60,70 90,55 120,70 90,85" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <polygon points="60,70 60,95 90,110 90,85" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>

    <!-- Third layer: 1 cube (on top center) -->
    <polygon points="30,30 60,15 90,30 60,45" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="30,30 30,55 60,70 60,45" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <polygon points="90,30 90,55 60,70 60,45" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>

    <text x="75" y="158" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Construcción (gris=base, azul=2ª capa, amarillo=cima)</text>
  </g>
  <text x="150" y="178" text-anchor="middle" font-size="10" fill="#374151" font-family="Arial">¿Cuántos cubos en total? a)9  b)12  c)14  d)16</text>
  <text x="150" y="195" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Incluye los cubos ocultos que soportan la estructura</text>
</svg>