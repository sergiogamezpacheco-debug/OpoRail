<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <rect width="280" height="200" fill="#f9fafb"/>
  <text x="140" y="16" text-anchor="middle" font-size="11" fill="#374151" font-family="Arial">Cuadrado mágico de dominó</text>
  <!-- 3x3 grid of half-dominoes -->
  <text x="140" y="34" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">Cada fila, columna y diagonal suma lo mismo</text>
  <g transform="translate(35,45)">
    <!-- Row 1: 2, 7, 6 -->
    <rect x="0" y="0" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <circle cx="18" cy="16" r="5" fill="#374151"/><circle cx="37" cy="29" r="5" fill="#374151"/>
    <text x="27" y="55" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">2</text>

    <rect x="65" y="0" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <!-- 7 dots -->
    <circle cx="78" cy="8" r="4" fill="#374151"/><circle cx="92" cy="8" r="4" fill="#374151"/>
    <circle cx="78" cy="22" r="4" fill="#374151"/><circle cx="92" cy="22" r="4" fill="#374151"/>
    <circle cx="78" cy="36" r="4" fill="#374151"/><circle cx="92" cy="36" r="4" fill="#374151"/>
    <circle cx="85" cy="14" r="4" fill="#374151"/>
    <text x="92" y="55" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">7</text>

    <rect x="130" y="0" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <!-- 6 dots -->
    <circle cx="143" cy="10" r="4" fill="#374151"/><circle cx="157" cy="10" r="4" fill="#374151"/>
    <circle cx="143" cy="22" r="4" fill="#374151"/><circle cx="157" cy="22" r="4" fill="#374151"/>
    <circle cx="143" cy="34" r="4" fill="#374151"/><circle cx="157" cy="34" r="4" fill="#374151"/>
    <text x="157" y="55" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">6</text>

    <!-- Row 2: 9, 5, 1 -->
    <rect x="0" y="60" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <!-- 9 dots (simplified) -->
    <circle cx="13" cy="67" r="3.5" fill="#374151"/><circle cx="27" cy="67" r="3.5" fill="#374151"/>
    <circle cx="13" cy="80" r="3.5" fill="#374151"/><circle cx="27" cy="80" r="3.5" fill="#374151"/>
    <circle cx="13" cy="93" r="3.5" fill="#374151"/><circle cx="27" cy="93" r="3.5" fill="#374151"/>
    <circle cx="20" cy="74" r="3.5" fill="#374151"/><circle cx="20" cy="87" r="3.5" fill="#374151"/>
    <circle cx="40" cy="80" r="3.5" fill="#374151"/>
    <text x="27" y="115" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">9</text>

    <rect x="65" y="60" width="55" height="45" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" rx="3"/>
    <text x="92" y="87" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="bold" font-family="Arial">?</text>
    <text x="92" y="115" text-anchor="middle" font-size="9" fill="#16a34a" font-family="Arial">?</text>

    <rect x="130" y="60" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <circle cx="157" cy="83" r="5" fill="#374151"/>
    <text x="157" y="115" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">1</text>

    <!-- Row 3: 4, 3, 8 -->
    <rect x="0" y="120" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <circle cx="13" cy="130" r="4" fill="#374151"/><circle cx="27" cy="130" r="4" fill="#374151"/>
    <circle cx="13" cy="155" r="4" fill="#374151"/><circle cx="27" cy="155" r="4" fill="#374151"/>
    <text x="27" y="175" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">4</text>

    <rect x="65" y="120" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <circle cx="85" cy="130" r="4" fill="#374151"/>
    <circle cx="92" cy="143" r="4" fill="#374151"/>
    <circle cx="99" cy="156" r="4" fill="#374151"/>
    <text x="92" y="175" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">3</text>

    <rect x="130" y="120" width="55" height="45" fill="white" stroke="#374151" stroke-width="1.5" rx="3"/>
    <circle cx="143" cy="128" r="3.5" fill="#374151"/><circle cx="157" cy="128" r="3.5" fill="#374151"/>
    <circle cx="143" cy="143" r="3.5" fill="#374151"/><circle cx="157" cy="143" r="3.5" fill="#374151"/>
    <circle cx="143" cy="158" r="3.5" fill="#374151"/><circle cx="157" cy="158" r="3.5" fill="#374151"/>
    <circle cx="150" cy="136" r="3.5" fill="#374151"/><circle cx="150" cy="151" r="3.5" fill="#374151"/>
    <text x="157" y="175" text-anchor="middle" font-size="9" fill="#6b7280" font-family="Arial">8</text>
  </g>
  <text x="140" y="190" text-anchor="middle" font-size="9" fill="#374151" font-family="Arial">Suma mágica = 15. Si fila 2 = 9+?+1=15, ¿? =</text>
</svg>