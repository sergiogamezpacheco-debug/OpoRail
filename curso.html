<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curso | OpoRail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased bg-gray-50">
  <div id="site-header"></div>

  <main class="container mx-auto px-4 py-24 md:py-28">
    <div id="course-detail"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/load-header.js"></script>
  <script type="module">
    import { auth } from "/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    async function syncAdminStatus(user) {
      const email = String(user?.email || "").toLowerCase().trim();

      if (!email) {
        localStorage.setItem("oporail_is_admin", "false");
      } else {
        try {
          const response = await fetch("/data/admins.json", { cache: "no-store" });
          if (!response.ok) throw new Error("No se pudo cargar admins.json");

          const data = await response.json();
          const admins = Array.isArray(data?.emails) ? data.emails : [];
          const isAdmin = admins
            .map((item) => String(item || "").toLowerCase().trim())
            .includes(email);

          localStorage.setItem("oporail_is_admin", isAdmin ? "true" : "false");
        } catch (error) {
          console.error("No se pudo comprobar el estado de administrador:", error);
        }
      }

      const script = document.createElement("script");
      script.src = "js/load-data.js";
      script.onload = () => {
        const architectureScript = document.createElement("script");
        architectureScript.src = "js/temario-structure.js";
        document.body.appendChild(architectureScript);
      };
      document.body.appendChild(script);
    }

    onAuthStateChanged(auth, syncAdminStatus);
  </script>
</body>
</html>
